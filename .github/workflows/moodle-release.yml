##############################################################################
# GitHub Actions Release CI – local_catquizlab
#
# Triggered on push / PR to main.
# Provides the "CI complete (release)" status check for branch protection.
#
# Same job set as moodle-ci.yml (worker check, lint, structure, PHPUnit,
# Behat), condensed: the release gate runs the full PHPUnit/Behat matrices
# but skips the informational linters that are dev-branch feedback only.
##############################################################################

name: Moodle Plugin Release CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, not '^4' (#171): moodle-plugin-ci 4.5.12 brought moodle-cs 3.9.2, which forbids unserialize(); the
  # floating constraint turned the lint red on 7cb86911 without a change to the plugin, and the local lint gate,
  # still on 4.5.11, could not see it. The same version is installed for the local gate, and the gate checks that
  # both say the same. Raise it here and there together, deliberately.
  MOODLE_CI: '4.5.12'
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_PROCESS_TIMEOUT: 0
  COMPOSER_NO_AUDIT: 1
  PGPASSWORD: moodle

jobs:

  worker-check:
    name: "Worker syntax check"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Syntax-check worker scripts
        working-directory: worker
        run: |
          node --check run_attempt.js
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"

  # ── The benchmark gate, fail closed (#170) ───────────────────────────────
  # The CLARA-like benchmark's judgement (cli/clara_bench.py) checks its data set before it judges it. Its negative
  # matrix — every way a data set can be incomplete or wrong, each injected into a complete one and run through the
  # command line — must end nonzero case by case, the complete one zero; the protocol is kept as an artifact (#170
  # DoD 1, DoD 3). Cheap: no Moodle, no database, seconds.
  gate-selftest:
    name: "Issue 170 — benchmark gate: negative matrix, reference replay"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: The CLARA benchmark gate's negative matrix (each injected defect must end nonzero)
        run: |
          set -o pipefail
          mkdir -p gate-selftest
          python3 cli/clara_bench.py --self-test --protocol gate-selftest/negative-matrix.md \
              | tee gate-selftest/clara-bench-self-test.txt
          cat gate-selftest/negative-matrix.md >> "$GITHUB_STEP_SUMMARY"

      - name: The load step verdict's self-test
        run: |
          set -o pipefail
          python3 cli/load_step_verdict.py --self-test | tee gate-selftest/load-step-verdict-self-test.txt

      # #170 DoD 2: the reference run (Acceptance 45038234242 on e605b2e7, 22.11.2026) replayed from its original
      # artifact ZIPs, byte for byte, in tests/fixtures/clara-reference-e605b2e7/: digests as written in
      # cli/clara_reference.py, the legs judged by the current clara_bench.py with profile 0.7.78 (that run's matrix,
      # accepted for that commit only) and that commit's pins, the report read back, every point as in the original
      # report. A missing or changed fixture, an unreadable archive, a defect or a point other than the original's
      # ends nonzero — never a skip.
      # The fixture's pins against the repository's own history: .github/engine-pins*.env as committed in e605b2e7
      # (re-audit 26.11.2026, section 2.3) — the pins of that run, not today's.
      - name: "Issue 170 — the fixture's engine pins are those of e605b2e7 (git history)"
        run: |
          set -o pipefail
          git fetch --no-tags --depth=1 origin e605b2e78797efae7aed2e190efea5b10b0a3ac5
          for f in engine-pins.env engine-pins-previous.env; do
              git show "FETCH_HEAD:.github/$f" | cmp - "tests/fixtures/clara-reference-e605b2e7/pins/$f"
              echo "pins/$f: identical with e605b2e7:.github/$f"
          done

      - name: "Issue 170 — the reference run 45038234242 replayed from its original artifacts"
        run: |
          set -o pipefail
          mkdir -p gate-selftest/reference
          python3 cli/clara_reference.py --fixture tests/fixtures/clara-reference-e605b2e7 \
              --out gate-selftest/reference | tee gate-selftest/reference/replay.txt
          cat gate-selftest/reference/reference-replay.md >> "$GITHUB_STEP_SUMMARY"

      - name: "Issue 170 — the replay's negative control (fixture changed or incomplete: nonzero)"
        if: always()
        run: |
          set -o pipefail
          mkdir -p gate-selftest/reference
          python3 cli/clara_reference.py --self-test --fixture tests/fixtures/clara-reference-e605b2e7 \
              --out gate-selftest/reference | tee gate-selftest/reference/negative-control.txt
          cat gate-selftest/reference/reference-negative-control.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: catquizlab-gate-selftest
          path: gate-selftest
          retention-days: 90

  lint:
    name: "Lint / structure (PHP ${{ matrix.php }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-retries=10

    steps:
      - uses: actions/checkout@v5
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Install moodle-plugin-ci
        # Up to four tries: github.com refused one composer clone with 403 on 2026-11-22.
        run: |
          bash plugin/.github/scripts/install-plugin-ci.sh "${{ env.MOODLE_CI }}"
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: PHP CodeSniffer (Moodle coding standard)
        run: moodle-plugin-ci phpcs plugin --max-warnings 0

      - name: Install Moodle 4.5 baseline (no test init)
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --branch MOODLE_405_STABLE \
            --db-type mariadb \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --db-user root \
            --db-pass root \
            --db-name moodle \
            --no-init
        env:
          DB: mariadb
          MOODLE_BRANCH: MOODLE_405_STABLE

      - name: PHPDoc check
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validate plugin structure
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        run: moodle-plugin-ci savepoints

  phpunit:
    name: "PHPUnit (${{ matrix.moodle }} / PHP ${{ matrix.php }} / ${{ matrix.db.engine }})"
    runs-on: ubuntu-24.04
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        # Moodle 5.0 is out of support upstream and was dropped from the matrix.
        moodle: [MOODLE_405_STABLE, MOODLE_502_STABLE, MOODLE_503_STABLE]
        php: ['8.2', '8.3']
        db:
          - { engine: mariadb, type: mariadb, port: 3306, user: root,   pass: root   }
          - { engine: pgsql,   type: pgsql,   port: 5432, user: moodle, pass: moodle }
        exclude:
          - { moodle: MOODLE_502_STABLE, php: '8.2' }
          - { moodle: MOODLE_503_STABLE, php: '8.2' }
        # Explicit additional PHP 8.4 coverage only for Moodle 5.3.
        include:
          - { moodle: MOODLE_503_STABLE, php: '8.4', db: { engine: mariadb, type: mariadb, port: 3306, user: root, pass: root } }
          - { moodle: MOODLE_503_STABLE, php: '8.4', db: { engine: pgsql, type: pgsql, port: 5432, user: moodle, pass: moodle } }

    services:
      mariadb:
        image: ${{ matrix.moodle == 'MOODLE_503_STABLE' && 'mariadb:11.4' || 'mariadb:10.11' }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s --health-retries=10
      pgsql:
        image: ${{ matrix.moodle == 'MOODLE_503_STABLE' && 'postgres:17' || 'postgres:16' }}
        env:
          POSTGRES_USER:     moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB:       postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U moodle -d postgres"
          --health-interval=10s --health-retries=5

    steps:
      - uses: actions/checkout@v5
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, pdo_pgsql, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Install moodle-plugin-ci
        # Up to four tries: github.com refused one composer clone with 403 on 2026-11-22.
        run: |
          bash plugin/.github/scripts/install-plugin-ci.sh "${{ env.MOODLE_CI }}"
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      # The release gate tests against the engine, as the dev CI does: without
      # it every engine-facing test skips, and a green release said nothing about
      # the engine it ships with (re-audit 16.10.2026, AK 1/5). Branch and commit
      # come from .github/engine-pins.env; the manifest says what was tested.
      - name: Fetch the CAT engine (pinned set)
        run: bash plugin/.github/scripts/fetch-engine.sh
        env:
          ENGINE_DIR: ${{ github.workspace }}/engine
          ENGINE_MANIFEST: ${{ github.workspace }}/engine-manifest.txt
          MOODLE_BRANCH: ${{ matrix.moodle }}

      - name: Install Moodle, engine and plugin
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --extra-plugins "$GITHUB_WORKSPACE/engine" \
            --db-host 127.0.0.1 \
            --db-port ${{ matrix.db.port }} \
            --db-user ${{ matrix.db.user }} \
            --db-pass ${{ matrix.db.pass }} \
            --db-name moodle
        env:
          DB: ${{ matrix.db.type }}
          MOODLE_BRANCH: ${{ matrix.moodle }}

      # The R re-analysis of the research data package (#157 DoD2) runs inside PHPUnit
      # (research_package_test::test_the_r_reanalysis_reproduces_the_dashboard). Without R it was the one skip of
      # this gate (#140, run 43746130162); now R is installed, pinned to Ubuntu 24.04's 4.3.3, and the test fails
      # where R is missing instead of skipping. Base R only.
      - name: Install R for the re-analysis (pinned)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends r-base-core=4.3.3-2build2
          Rscript --version

      # --testdox: every test by name in the log, so that a test named as evidence in an issue can be found as run and
      # passed on exactly this commit (re-audit 17.11.2026: an existing test file alone is no evidence).
      # An incomplete test fails the job; a skipped one is checked in the next step against the allow list.
      - name: PHPUnit – all tests
        run: |
          set -o pipefail
          moodle-plugin-ci phpunit --fail-on-warning --fail-on-incomplete --testdox 2>&1 | tee "$GITHUB_WORKSPACE/phpunit.log"
        env:
          CATQUIZLAB_REQUIRE_R: '1'

      # Gate 3 (re-audit 18.11.2026): every test that did not run, by name, each with the reason it may skip in this
      # job (.github/phpunit-allowed-skips.txt); any other skip fails the gate.
      - name: Skips checked
        if: always()
        run: |
          python3 plugin/.github/scripts/phpunit-skips.py "$GITHUB_WORKSPACE/phpunit.log" \
              plugin/.github/phpunit-allowed-skips.txt "$GITHUB_WORKSPACE/phpunit-skips.json" \
              "phpunit ${{ matrix.moodle }} ${{ matrix.php }} ${{ matrix.db.engine }}"

      - name: Release manifest of this job
        if: always()
        env:
          JOB_NAME: "release-phpunit ${{ matrix.moodle }} ${{ matrix.php }} ${{ matrix.db.engine }}"
        run: |
          mkdir -p manifest
          bash plugin/.github/scripts/release-manifest.sh \
              > "manifest/manifest-release-phpunit-${{ matrix.moodle }}-${{ matrix.php }}-${{ matrix.db.engine }}.json"
          cp "$GITHUB_WORKSPACE/phpunit-skips.json" \
              "manifest/phpunit-skips-${{ matrix.moodle }}-${{ matrix.php }}-${{ matrix.db.engine }}.json" 2>/dev/null || true

      - name: Keep the engine manifest
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: engine-manifest-release-phpunit-${{ matrix.moodle }}-${{ matrix.php }}-${{ matrix.db.engine }}
          path: ${{ github.workspace }}/engine-manifest.txt
          retention-days: 30
          if-no-files-found: warn

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: manifest-release-phpunit-${{ matrix.moodle }}-${{ matrix.php }}-${{ matrix.db.engine }}
          path: manifest
          retention-days: 90

  behat:
    name: "Behat (${{ matrix.moodle }} / PHP ${{ matrix.php }} / Chrome)"
    runs-on: ubuntu-24.04
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { moodle: MOODLE_405_STABLE, php: '8.2' }
          - { moodle: MOODLE_502_STABLE, php: '8.3' }
          - { moodle: MOODLE_503_STABLE, php: '8.3' }

    services:
      mariadb:
        image: ${{ matrix.moodle == 'MOODLE_503_STABLE' && 'mariadb:11.4' || 'mariadb:10.11' }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s --health-retries=10

    steps:
      - uses: actions/checkout@v5
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Install moodle-plugin-ci
        # Up to four tries: github.com refused one composer clone with 403 on 2026-11-22.
        run: |
          bash plugin/.github/scripts/install-plugin-ci.sh "${{ env.MOODLE_CI }}"
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      # The release gate tests against the engine, as the dev CI does: without
      # it every engine-facing test skips, and a green release said nothing about
      # the engine it ships with (re-audit 16.10.2026, AK 1/5). Branch and commit
      # come from .github/engine-pins.env; the manifest says what was tested.
      - name: Fetch the CAT engine (pinned set)
        run: bash plugin/.github/scripts/fetch-engine.sh
        env:
          ENGINE_DIR: ${{ github.workspace }}/engine
          ENGINE_MANIFEST: ${{ github.workspace }}/engine-manifest.txt
          MOODLE_BRANCH: ${{ matrix.moodle }}

      - name: Install Moodle, engine and plugin
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --extra-plugins "$GITHUB_WORKSPACE/engine" \
            --branch ${{ matrix.moodle }} \
            --db-type mariadb \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --db-user root \
            --db-pass root \
            --db-name moodle
        env:
          DB: mariadb
          MOODLE_BRANCH: ${{ matrix.moodle }}

      - name: Behat – plugin scenarios
        run: |
          moodle-plugin-ci behat \
            --profile chrome \
            --tags "@local_catquizlab&&~@broken" \
            --start-servers

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: behat-screenshots-release-${{ matrix.moodle }}
          path: ${{ github.workspace }}/moodle/behatfaildumps/
          retention-days: 7

      - name: Keep the engine manifest
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: engine-manifest-release-behat-${{ matrix.moodle }}
          path: ${{ github.workspace }}/engine-manifest.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Release manifest of this job
        if: always()
        env:
          JOB_NAME: "release-behat ${{ matrix.moodle }} ${{ matrix.php }}"
        run: |
          mkdir -p manifest
          bash plugin/.github/scripts/release-manifest.sh > "manifest/manifest-release-behat-${{ matrix.moodle }}.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: manifest-release-behat-${{ matrix.moodle }}
          path: manifest
          retention-days: 90

  # Issue 167: the upgrade from what the live installation runs (0.7.60, 2026111400) to this commit, on every
  # Moodle and database of the matrix, with data written by 0.7.60's own code, checked by cli/upgrade_check.php
  # before and after, upgraded twice. The same job as in moodle-ci.yml, here because only this workflow runs on main.
  upgrade:
    name: "Upgrade 0.7.60 → this commit (${{ matrix.moodle }} / ${{ matrix.db.engine }})"
    runs-on: ubuntu-24.04
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        moodle: [MOODLE_405_STABLE, MOODLE_502_STABLE, MOODLE_503_STABLE]
        db:
          - { engine: mariadb, type: mariadb, port: 3306, user: root,   pass: root   }
          - { engine: pgsql,   type: pgsql,   port: 5432, user: moodle, pass: moodle }

    services:
      mariadb:
        image: ${{ matrix.moodle == 'MOODLE_503_STABLE' && 'mariadb:11.4' || 'mariadb:10.11' }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s --health-retries=10
      pgsql:
        image: ${{ matrix.moodle == 'MOODLE_503_STABLE' && 'postgres:17' || 'postgres:16' }}
        env:
          POSTGRES_USER:     moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB:       postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U moodle -d postgres"
          --health-interval=10s --health-retries=5

    steps:
      - uses: actions/checkout@v5
        with:
          path: plugin

      # 0.7.60 as released (a09be96b, version 2026111400).
      - uses: actions/checkout@v5
        with:
          path: plugin-old
          ref: a09be96b319120487dbc8456c1036075b19c0f7e

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, pdo_pgsql, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Install moodle-plugin-ci
        # Up to four tries: github.com refused one composer clone with 403 on 2026-11-22.
        run: |
          bash plugin/.github/scripts/install-plugin-ci.sh "${{ env.MOODLE_CI }}"
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Fetch the CAT engine
        run: bash plugin/.github/scripts/fetch-engine.sh
        env:
          ENGINE_DIR: ${{ github.workspace }}/engine
          ENGINE_MANIFEST: ${{ github.workspace }}/engine-manifest.txt
          MOODLE_BRANCH: ${{ matrix.moodle }}

      - name: Install Moodle, the engine and 0.7.60
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin-old \
            --extra-plugins "$GITHUB_WORKSPACE/engine" \
            --db-host 127.0.0.1 \
            --db-port ${{ matrix.db.port }} \
            --db-user ${{ matrix.db.user }} \
            --db-pass ${{ matrix.db.pass }} \
            --db-name moodle \
            --no-init
          # The site itself: --no-init writes the configuration only.
          php moodle/admin/cli/install_database.php --agree-license --adminpass='Upgrade-1!' \
            --adminemail=admin@example.com --fullname=Upgrade --shortname=upgrade
          # Moodle 5.x moves the question banks into activities in ad-hoc tasks after the installation; until they
          # have run nothing can be prepared (0.7.60's e2e_prepare.php says so and stops). As an installation's cron.
          php moodle/admin/cli/adhoc_task.php --execute
          ls -d moodle/public/local/catquizlab 2>/dev/null && echo "PLUGIN=moodle/public/local/catquizlab" >> "$GITHUB_ENV" \
            || echo "PLUGIN=moodle/local/catquizlab" >> "$GITHUB_ENV"
        env:
          DB: ${{ matrix.db.type }}
          MOODLE_BRANCH: ${{ matrix.moodle }}

      - name: Data, written by 0.7.60's own code
        run: |
          grep -E 'release' "$PLUGIN/version.php"
          php "$PLUGIN/cli/e2e_prepare.php" --persons=3 --name="Upgrade: provisioned" | grep -E '^runid='
          php "$PLUGIN/cli/seed_progress.php" --state=finished
          php "$PLUGIN/cli/seed_progress.php" --state=blocked
          # A stopped experiment (0.7.60 closes its open sittings as failed, with the stop's text) and a sitting
          # that failed for a technical reason: the upgrade makes the first cancelled (#166), the second stays failed.
          stopped=$(php "$PLUGIN/cli/seed_progress.php" --state=running | grep -E '^PROGRESS_RUNNING_EXPERIMENTID=' | cut -d= -f2)
          php "$PLUGIN/cli/stop_experiment.php" --experimentid="$stopped" --yes
          php "$PLUGIN/cli/seed_failed_attempt.php"

      - name: Before
        run: |
          cp plugin/cli/upgrade_check.php "$PLUGIN/cli/upgrade_check.php"
          php "$PLUGIN/cli/upgrade_check.php" --phase=before --out=/tmp/upgrade-before.json | tee /tmp/upgrade-before.txt

      - name: Issue 167 — the code of this commit in place, upgraded, checked
        run: |
          set -o pipefail
          # --checksum: the two checkouts of this job can land in the same second, and a file of the same size
          # (version.php: 2026111400 → 2026112102, '0.7.60' → '0.7.77') was then skipped by rsync's size-and-time test
          # — release CI 2026-11-22, 5.2/PostgreSQL: "No upgrade needed", 0.7.60 left in place. Then: nothing may differ.
          rsync -a --checksum --delete --exclude .git plugin/ "$PLUGIN/"
          diff -rq --exclude .git plugin/ "$PLUGIN/"
          # Moodle's upgrade script writes its "no upgrade needed" (and its errors) to STDERR: both into the record.
          php moodle/admin/cli/upgrade.php --non-interactive 2>&1 | tee /tmp/upgrade-1.txt
          php "$PLUGIN/cli/upgrade_check.php" --phase=after --before=/tmp/upgrade-before.json | tee /tmp/upgrade-after-1.txt

      - name: Issue 167 — upgraded again changes nothing
        run: |
          set -o pipefail
          # "No upgrade needed …" comes on STDERR with exit code 0 (cli_error(…, 0)); without 2>&1 the grep saw
          # nothing (release CI 2026-11-16, all six cells red here).
          php moodle/admin/cli/upgrade.php --non-interactive 2>&1 | tee /tmp/upgrade-2.txt
          grep -qi 'no upgrade needed' /tmp/upgrade-2.txt
          php "$PLUGIN/cli/upgrade_check.php" --phase=after --before=/tmp/upgrade-before.json | tee /tmp/upgrade-after-2.txt

      - name: Keep the upgrade record
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: upgrade-release-${{ matrix.moodle }}-${{ matrix.db.engine }}
          path: |
            /tmp/upgrade-*.txt
            /tmp/upgrade-before.json
            ${{ github.workspace }}/engine-manifest.txt
          retention-days: 30
          if-no-files-found: warn

  upgrade-moodle:
    # #136 DoD: Moodle 5.2 upgraded in place to 5.3 — the same database, the same moodledata, the same plugins of
    # this commit and the same engine set — and everything the plugin had written before still there and readable.
    name: "Moodle 5.2 → 5.3 in place, this commit (${{ matrix.db.engine }})"
    runs-on: ubuntu-24.04
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        db:
          - { engine: mariadb, type: mariadb, port: 3306, user: root,   pass: root   }
          - { engine: pgsql,   type: pgsql,   port: 5432, user: moodle, pass: moodle }

    # The database versions of Moodle 5.3 from the start: 5.2 runs on them too, and the upgrade must not need a
    # database upgrade beside it.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s --health-retries=10
      pgsql:
        image: postgres:17
        env:
          POSTGRES_USER:     moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB:       postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U moodle -d postgres"
          --health-interval=10s --health-retries=5

    steps:
      - uses: actions/checkout@v5
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, pdo_pgsql, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Install moodle-plugin-ci
        # Up to four tries: github.com refused one composer clone with 403 on 2026-11-22.
        run: |
          bash plugin/.github/scripts/install-plugin-ci.sh "${{ env.MOODLE_CI }}"
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Fetch the CAT engine (the 5.x set, the same for 5.2 and 5.3)
        run: bash plugin/.github/scripts/fetch-engine.sh
        env:
          ENGINE_DIR: ${{ github.workspace }}/engine
          ENGINE_MANIFEST: ${{ github.workspace }}/engine-manifest.txt
          MOODLE_BRANCH: MOODLE_502_STABLE

      - name: Install Moodle 5.2, the engine and this commit
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --extra-plugins "$GITHUB_WORKSPACE/engine" \
            --db-host 127.0.0.1 \
            --db-port ${{ matrix.db.port }} \
            --db-user ${{ matrix.db.user }} \
            --db-pass ${{ matrix.db.pass }} \
            --db-name moodle \
            --no-init
          php moodle/admin/cli/install_database.php --agree-license --adminpass='Upgrade-1!' \
            --adminemail=admin@example.com --fullname=Upgrade --shortname=upgrade
          php moodle/admin/cli/adhoc_task.php --execute
          echo "PLUGIN=moodle/public/local/catquizlab" >> "$GITHUB_ENV"
          echo "Moodle $(php moodle/admin/cli/cfg.php --name=release)"
        env:
          DB: ${{ matrix.db.type }}
          MOODLE_BRANCH: MOODLE_502_STABLE

      - name: Data, written on Moodle 5.2
        run: |
          php "$PLUGIN/cli/e2e_prepare.php" --persons=3 --name="Moodle upgrade: provisioned" | grep -E '^runid='
          php "$PLUGIN/cli/seed_progress.php" --state=finished
          php "$PLUGIN/cli/seed_progress.php" --state=blocked
          php "$PLUGIN/cli/seed_progress.php" --state=stopped
          php "$PLUGIN/cli/seed_failed_attempt.php"
          php "$PLUGIN/cli/upgrade_check.php" --phase=before --out=/tmp/moodle-upgrade-before.json \
            | tee /tmp/moodle-upgrade-before.txt

      - name: Moodle 5.3 in place of 5.2, upgraded
        run: |
          set -o pipefail
          # Core only: config.php, moodledata, the database and every plugin directory stay where they are.
          git -C moodle fetch --depth 1 origin MOODLE_503_STABLE
          git -C moodle checkout -q FETCH_HEAD
          php moodle/admin/cli/upgrade.php --non-interactive 2>&1 | tee /tmp/moodle-upgrade-1.txt
          echo "Moodle $(php moodle/admin/cli/cfg.php --name=release)" | tee -a /tmp/moodle-upgrade-1.txt
          grep -q 'Moodle 5\.3' /tmp/moodle-upgrade-1.txt
          php "$PLUGIN/cli/upgrade_check.php" --phase=after --before=/tmp/moodle-upgrade-before.json \
            | tee /tmp/moodle-upgrade-after.txt

      - name: Upgraded again changes nothing
        run: |
          set -o pipefail
          php moodle/admin/cli/upgrade.php --non-interactive 2>&1 | tee /tmp/moodle-upgrade-2.txt
          grep -qi 'no upgrade needed' /tmp/moodle-upgrade-2.txt

      - name: Keep the upgrade record
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: upgrade-moodle-502-503-${{ matrix.db.engine }}
          path: |
            /tmp/moodle-upgrade-*.txt
            /tmp/moodle-upgrade-before.json
            ${{ github.workspace }}/engine-manifest.txt
          retention-days: 30
          if-no-files-found: warn

  ci-complete:
    name: CI complete (release)
    needs: [worker-check, gate-selftest, lint, phpunit, behat, upgrade, upgrade-moodle]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: All matrix jobs must have succeeded
        run: |
          result="${{ needs.worker-check.result }}-${{ needs.gate-selftest.result }}-${{ needs.lint.result }}-${{ needs.phpunit.result }}-${{ needs.behat.result }}-${{ needs.upgrade.result }}-${{ needs.upgrade-moodle.result }}"
          if [[ "$result" == "success-success-success-success-success-success-success" ]]; then
            echo "All release CI jobs passed."
          else
            echo "CI result: $result – one or more jobs failed or were cancelled."
            exit 1
          fi
