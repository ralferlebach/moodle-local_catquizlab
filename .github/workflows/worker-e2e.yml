##############################################################################
# Worker CI – local_catquizlab
#
# Two jobs with deliberately different requirements.
#
# "toolchain" proves that the Node/Puppeteer toolchain installs and works. It
# runs on every push and needs no Moodle, no token and no network beyond the
# checkout and the npm install. Before this, that job "smoke tested" the worker
# by pointing it at https://example.invalid, which made it start its normal
# polling loop, call local_catquizlab_job_claim and fail on DNS every single
# time. A job that is red by construction says nothing about the code, so the
# real checks — a syntax check, the unit tests and an offline self test that
# also starts a browser — replace it.
#
# "e2e" plays real sittings through the real UI and therefore needs a running
# Moodle with the CAT engine installed: on every push and pull request to main
# (the release gate, re-audit 16.10.2026 AK 4) and by hand. It runs twice,
# each supported Moodle line: 4.5 legacy, 5.2 and 5.3 with the 1.3
# engine set, all pinned (.github/engine-pins.env). The web server runs at the
# production memory limit, 512M (AK 6).
##############################################################################

name: Worker CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Also run the end-to-end job (needs the CAT engine)'
        type: boolean
        # Ticked by default: somebody starting this by hand almost always wants
        # the end-to-end run, and having to remember the box means the run that
        # would have caught something is the one that skipped it.
        default: true
        required: false
      memory_limit:
        description: 'PHP memory_limit of the web server (the production reference is 512M)'
        required: false
        default: '512M'
      engine_heads:
        description: 'Test the engine branch heads instead of the pinned commits'
        type: boolean
        required: false
        default: false

concurrency:
  group: worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    name: "Worker toolchain and unit tests"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install worker dependencies (Puppeteer + Chromium)
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Check worker syntax
        working-directory: worker
        run: npm run check

      - name: Run worker unit tests
        working-directory: worker
        run: npm test

      # This is what the old step was actually meant to prove: that Puppeteer
      # resolved and its Chromium download works on this runner. It contacts no
      # Moodle instance and claims no job.
      - name: Worker self test (offline)
        working-directory: worker
        run: npm run selftest

  e2e:
    name: "Worker end-to-end (${{ matrix.stack }}, ${{ matrix.pins }} engine set)"
    runs-on: ubuntu-24.04
    needs: toolchain
    # By hand, and as the release gate: every push and pull request to main.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_e2e)
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Three roots, kept apart (#135):
          # - coreroot: where config.php and core's admin/cli/*.php live;
          # - dirroot:  where plugins live ($CFG->dirroot) and their cli/*.php run;
          # - webroot:  what the web server serves.
          # On Moodle 4.5 all three are the checkout. From Moodle 5.1 plugins and
          # the web entry points are under public/, while core's command-line
          # scripts stay at the top: moodle/admin/cli/install_database.php, not
          # moodle/public/admin/cli/… — running the installer from dirroot found
          # nothing to run.
          # Two engine sets per stack (#136): `release`, the baseline of .github/engine-pins.env, and `candidate`,
          # CatQuiz #146 with its host lines from .github/engine-pins-interface.env — the set the interface E2E
          # already plays. Every step runs against both; the candidate becomes the release set once its legs are
          # green (#136 DoD), not before.
          # Moodle 4.5: local_catquiz 1.2.1, the live line.
          - { stack: legacy, pins: release, moodle: MOODLE_405_STABLE, coreroot: moodle, dirroot: moodle, webroot: moodle }
          - { stack: legacy, pins: candidate, moodle: MOODLE_405_STABLE, coreroot: moodle, dirroot: moodle, webroot: moodle }
          # Moodle 5.2 and 5.3: local_catquiz 1.3.0, host v-3.0; plugins and web under public/.
          - { stack: moodle5, pins: release, moodle: MOODLE_502_STABLE, coreroot: moodle, dirroot: moodle/public, webroot: moodle/public }
          - { stack: moodle5, pins: candidate, moodle: MOODLE_502_STABLE, coreroot: moodle, dirroot: moodle/public, webroot: moodle/public }
          - { stack: moodle53, pins: release, moodle: MOODLE_503_STABLE, coreroot: moodle, dirroot: moodle/public, webroot: moodle/public }
          - { stack: moodle53, pins: candidate, moodle: MOODLE_503_STABLE, coreroot: moodle, dirroot: moodle/public, webroot: moodle/public }
    env:
      PHP_MEMORY_LIMIT: ${{ github.event.inputs.memory_limit || '512M' }}
    services:
      postgres:
        image: ${{ matrix.moodle == 'MOODLE_503_STABLE' && 'postgres:17' || 'postgres:16' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v5
        with:
          path: plugin

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, gd, soap, intl, mbstring, curl, zip, bcmath
          # The command line keeps room; the web server runs at PHP_MEMORY_LIMIT.
          ini-values: max_input_vars=8000, memory_limit=1024M

      - name: Check out Moodle
        run: git clone --depth 1 -b ${{ matrix.moodle }} https://github.com/moodle/moodle.git moodle

      # The pinned engine set of this Moodle line, with the hub subplugins; the
      # manifest records the commits tested.
      - name: Check out the CAT engine and its host activity (pinned set)
        env:
          ENGINE_DIR: ${{ github.workspace }}/${{ matrix.dirroot }}
          ENGINE_LAYOUT: moodle
          ENGINE_SUBMODULES: '1'
          ENGINE_MANIFEST: ${{ github.workspace }}/engine-manifest.txt
          PINS_FILE: ${{ github.workspace }}/plugin/.github/${{ matrix.pins == 'candidate' && 'engine-pins-interface.env' || 'engine-pins.env' }}
          ENGINE_FOLLOW_HEADS: ${{ github.event.inputs.engine_heads == 'true' && '1' || '0' }}
          MOODLE_BRANCH: ${{ matrix.moodle }}
        run: |
          echo "Engine set: ${{ matrix.pins }} ($(basename "$PINS_FILE"))"
          bash plugin/.github/scripts/fetch-engine.sh
          echo "local_catquizlab  ${GITHUB_SHA}" >> "$ENGINE_MANIFEST"
          cp -r plugin ${{ matrix.dirroot }}/local/catquizlab

      - name: Configure Moodle
        run: |
          mkdir -p "$HOME/moodledata"
          cat > ${{ matrix.coreroot }}/config.php <<'PHP'
          <?php
          unset($CFG);
          global $CFG;
          $CFG = new stdClass();
          $CFG->dbtype    = 'pgsql';
          $CFG->dblibrary = 'native';
          $CFG->dbhost    = '127.0.0.1';
          $CFG->dbname    = 'moodle';
          $CFG->dbuser    = 'postgres';
          $CFG->dbpass    = 'moodle';
          $CFG->prefix    = 'mdl_';
          $CFG->dboptions = ['dbpersist' => 0, 'dbport' => 5432, 'dbsocket' => '', 'dbcollation' => ''];
          $CFG->wwwroot   = 'http://127.0.0.1:8000';
          $CFG->dataroot  = getenv('HOME') . '/moodledata';
          $CFG->admin     = 'admin';
          $CFG->directorypermissions = 0777;
          require_once(__DIR__ . '/lib/setup.php');
          PHP

      # Each root holds what the steps below will look for in it. A layout
      # mistake fails here, by name, instead of as "Could not open input file"
      # three steps later (#135).
      - name: Check the three roots
        run: |
          check() { if [ ! -e "$1" ]; then echo "::error::$2: $1 is missing"; missing=1; fi; }
          missing=0
          check "${{ matrix.coreroot }}/config.php" "coreroot holds config.php"
          check "${{ matrix.coreroot }}/admin/cli/install_database.php" "coreroot holds core's command-line scripts"
          check "${{ matrix.coreroot }}/admin/cli/cron.php" "coreroot holds core's command-line scripts"
          check "${{ matrix.dirroot }}/local/catquizlab/version.php" "dirroot holds the plugin"
          check "${{ matrix.dirroot }}/local/catquiz/version.php" "dirroot holds the engine"
          check "${{ matrix.dirroot }}/mod/adaptivequiz/version.php" "dirroot holds the host activity"
          check "${{ matrix.dirroot }}/local/catquizlab/cli/e2e_prepare.php" "dirroot holds the plugin's command-line scripts"
          check "${{ matrix.webroot }}/index.php" "webroot holds the web entry point"
          check "${{ matrix.webroot }}/config.php" "webroot reaches config.php"
          echo "coreroot=${{ matrix.coreroot }} dirroot=${{ matrix.dirroot }} webroot=${{ matrix.webroot }}"
          exit $missing

      - name: Install Moodle
        id: install
        working-directory: ${{ matrix.coreroot }}
        run: |
          php admin/cli/install_database.php --agree-license \
              --adminpass='Admin123!' --adminemail=admin@example.com \
              --fullname="CATLab E2E" --shortname="CATLabE2E"
          # A schema that exists, read back, before anything is measured (#135 AK 4):
          # core, the engine, the host and this plugin, each with its version.
          for component in core local_catquiz mod_adaptivequiz local_catquizlab; do
            if [ "$component" = core ]; then v=$(php admin/cli/cfg.php --name=version);
            else v=$(php admin/cli/cfg.php --component="$component" --name=version); fi
            if [ -z "$v" ]; then echo "::error::$component is not installed"; exit 1; fi
            echo "$component $v" | tee -a "${{ github.workspace }}/installed-versions.txt"
          done

      # What cron would do after an installation. On Moodle 5 the installer
      # queues the transfer of question banks into question bank activities;
      # until it has run, mod_adaptivequiz shows "Item bank is not configured
      # properly" instead of a start button, and the worker finds no way to
      # start an attempt (#135). On Moodle 4.5 this runs whatever is queued.
      - name: Run the installation's ad-hoc tasks
        working-directory: ${{ matrix.coreroot }}
        run: php admin/cli/adhoc_task.php --execute

      # Everything the worker needs is prepared by the plugin's own CLI rather
      # than assembled in YAML, so the E2E job exercises the same provisioning
      # path an operator uses.
      - name: Provision an experiment, a run and a worker token
        id: prepare
        working-directory: ${{ matrix.dirroot }}
        # Filtered, not trusted. Everything this script writes lands in
        # $GITHUB_OUTPUT, and one line that is not key=value fails the whole
        # step with a parse error instead of the real problem — which has now
        # happened twice: once with a colon in an error message, once with a
        # diagnostic line of mine. Moodle's own fatal errors go to stdout too,
        # so no amount of care inside the script makes this safe.
        run: |
          set -o pipefail
          php local/catquizlab/cli/e2e_prepare.php --persons=1 \
            | tee /tmp/prepare.log \
            | grep -E '^[a-z_]+=' >> "$GITHUB_OUTPUT"
          # The worker token stays out of the log (#149): masked for every later step and for the step output that
          # GitHub prints with debug logging ("Set output token = …"); the 9bd6152 logs had it in clear.
          token=$(sed -n 's/^token=//p' /tmp/prepare.log | head -n 1)
          if [ -n "$token" ]; then echo "::add-mask::$token"; fi

      - name: Show what preparation reported
        if: always()
        # Everything but the token, which is masked anyway.
        run: sed -E 's/^(token=).*/\1(not shown)/' /tmp/prepare.log || true

      - name: Start the web server
        id: web
        working-directory: ${{ matrix.webroot }}
        run: |
          # More than one worker. PHP's development server answers one request
          # at a time by default, and the self-test makes an HTTP call to this
          # very server from inside a request — which then waits for itself
          # until it times out and reports the token as not answering. On a
          # real web server this never happens, which is why the same self-test
          # is green on a production site and red here.
          PHP_CLI_SERVER_WORKERS=4 nohup php -d memory_limit="${PHP_MEMORY_LIMIT}" -S 127.0.0.1:8000 -t . \
              > /tmp/webserver.log 2>&1 &
          # The web server's processes, sampled every two seconds: resident memory for AK 6.
          # shellcheck disable=SC2016 # expanded by the inner shell, on purpose
          nohup bash -c 'echo "unixtime,pid,rss_kb" > /tmp/php-rss.csv; while true; do
              ps -C php -o pid=,rss= | while read -r pid rss; do echo "$(date +%s),$pid,$rss"; done >> /tmp/php-rss.csv;
              sleep 2; done' > /dev/null 2>&1 &
          start=$(date +%s)
          for _ in $(seq 1 20); do
            # The measuring window opens only once the server answers (#135 AK 5).
            if curl -sf -o /dev/null http://127.0.0.1:8000/; then echo "$start" > /tmp/e2e-start; exit 0; fi
            sleep 1
          done
          echo "The web server did not come up." >&2
          cat /tmp/webserver.log >&2
          exit 1

      - name: Install worker dependencies
        working-directory: ${{ matrix.dirroot }}/local/catquizlab/worker
        run: npm install --no-audit --no-fund

      - name: Play one attempt through the real UI
        working-directory: ${{ matrix.dirroot }}/local/catquizlab/worker
        # The token in the environment, not on the command line, where every
        # process listing shows it (#111).
        env:
          CATQUIZLAB_WORKER_TOKEN: ${{ steps.prepare.outputs.token }}
        run: |
          node run_attempt.js \
              --base-url=http://127.0.0.1:8000 \
              --max-jobs=1

      - name: Verify the queue reports the attempt as finished
        working-directory: ${{ matrix.dirroot }}
        run: php local/catquizlab/cli/e2e_prepare.php --verify --runid=${{ steps.prepare.outputs.runid }}

      # Eight claimers at the same instant, 200 claims: no sitting may be handed
      # out twice. Before 0.7.42 the claim was not atomic; locally 200 claims
      # got 52 sittings, and in the 300-sitting load test two executions played
      # one sitting (HTTP 404, "submission out of sequence"). The run's sittings
      # are failed afterwards, so no later step plays them.
      - name: Claims are exclusive — eight claimers at once, no sitting handed out twice
        working-directory: ${{ matrix.dirroot }}
        timeout-minutes: 10
        run: |
          set -o pipefail
          runid=$(php local/catquizlab/cli/e2e_prepare.php --persons=300 | grep -E '^runid=' | cut -d= -f2)
          php local/catquizlab/cli/claim_race.php --runid="$runid" --processes=8 --claims=25

      # Issue 163: a claim hands out only sittings of the experiment holding the
      # execution line. On the live installation the line was held by one
      # experiment for a day while every worker played another's sittings: the
      # claim read every ready run, oldest due time first. Here, under a backlog
      # like that one (twenty experiments started outside the line, sittings
      # queued earlier, some in play), every claim must be the holder's, in the
      # order they were queued; 11 and 25 claimers at once hand out none twice
      # and none of another experiment; the holder through, the line moves on
      # and the others wait at its end in the order they were queued. Times per
      # claim, for the counts and the forecast, and the query plan are kept.
      - name: Issue 163 — claims follow the execution line, under a backlog, 11 and 25 claimers at once
        working-directory: ${{ matrix.dirroot }}
        timeout-minutes: 15
        run: |
          set -o pipefail
          php local/catquizlab/cli/claim_bench.php --old=20 --per=2000 --claims=120 --processes=11,25 | tee /tmp/claim-bench.txt

      # Issue 163 with real workers: a run started outside the line, queued
      # first, and an experiment started afterwards with "Start experiment".
      # The started one holds the line and is played first; the other is given
      # a place behind it and is played after the holder's last sitting has
      # ended — moved on by the workers' own claims, without a tick or a click.
      - name: Issue 163 — two experiments, real workers, the holder first and nothing beside it
        working-directory: ${{ matrix.dirroot }}
        timeout-minutes: 20
        run: |
          set -o pipefail
          outside=$(php local/catquizlab/cli/e2e_prepare.php --persons=4 --name="Line: started outside" | grep -E '^runid=' | cut -d= -f2)
          holder=$(php local/catquizlab/cli/e2e_prepare.php --persons=4 --name="Line: started" | grep -E '^runid=' | cut -d= -f2)
          php local/catquizlab/cli/line_order_check.php --outside="$outside" --holder="$holder" --workers=4 --minutes=15 \
            | tee /tmp/line-order.txt

      # One attempt through the UI proves the worker can play a question. It
      # does not prove that an experiment reaches results, and for five
      # releases it did not: a worker that stopped after one attempt, a
      # heartbeat refused since 0.6.14, and a status card claiming a simulation
      # that was not running all passed every check this repository had.
      - name: Play one experiment per strategy, definition to results
        working-directory: ${{ matrix.dirroot }}
        env:
          MOODLE_ROOT: ${{ github.workspace }}/${{ matrix.dirroot }}
          MINUTES: 4
        run: bash local/catquizlab/cli/smoke_all.sh


      # Issue 138 AK3: the order engine attempt → trace → collected under real
      # concurrency. Eight sittings are played and kept; then their end is played
      # again in separate PHP processes at once — workers reporting completion
      # again and again, the pipeline tick, a run re-collection, the lease
      # recovery — while a reader process watches every row, and the engine's
      # attempt only reappears after twelve seconds (a late trace). Checked per
      # sitting: never collected before its engine attempt was back, never
      # without its trace or engine attempt, collected exactly once with the
      # same trace, the engine attempt not doubled. Put back as it was after.
      - name: Issue 138 — collection under concurrency, a late trace, a reader
        working-directory: ${{ matrix.dirroot }}
        timeout-minutes: 15
        env:
          MOODLE_ROOT: ${{ github.workspace }}/${{ matrix.dirroot }}
        run: |
          set -o pipefail
          php local/catquizlab/cli/smoke.php --strategy=fastest --persons=8 --minutes=8 --require-all --keep \
              | tee /tmp/race-smoke.log
          sed -n 's/.*Defined experiment \([0-9]*\).*/\1/p' /tmp/race-smoke.log | head -1 > /tmp/race-experiment
          php local/catquizlab/cli/race_collect.php --sittings=8 --reporters=4 --seconds=40 --delay=12 \
              | tee /tmp/race-collect.json

      # Issue 161 DoD 2 (and #145 AK 1): the experiment just played, deleted
      # deeply as on a site — stopped and queued by the confirmation, carried
      # out by the background task with the real course_delete_module() and
      # the activity's own callbacks. Before: every run's footprint in the
      # engine, the activity and Moodle, the rows of others sharing an attempt
      # number, and the engine's ownerless rows. After: the experiment gone,
      # nothing of the footprint left, every row of others there, no kind of
      # ownerless engine row grown, and the deletion record complete.
      - name: Issue 161 — deep deletion against the real engine, checked before and after
        working-directory: ${{ matrix.dirroot }}
        timeout-minutes: 10
        run: |
          set -o pipefail
          exp=$(cat /tmp/race-experiment)
          test -n "$exp" || { echo "No experiment from the step before." >&2; exit 1; }
          php local/catquizlab/cli/deep_delete_check.php --experimentid="$exp" --phase=before > /tmp/deep-delete-before.json
          php local/catquizlab/cli/deep_delete_check.php --experimentid="$exp" --phase=queue
          php "${{ github.workspace }}/${{ matrix.coreroot }}/admin/cli/adhoc_task.php" --execute \
              --classname='\local_catquizlab\task\delete_experiment'
          php local/catquizlab/cli/deep_delete_check.php --experimentid="$exp" --phase=after \
              --before=/tmp/deep-delete-before.json | tee /tmp/deep-delete-check.txt
          php local/catquizlab/cli/deletion_report.php --experimentid="$exp" --expect-deleted | tee -a /tmp/deep-delete-check.txt

      # Issue 151 DoD 2 and DoD 5: one start, then nobody. A definition saved
      # and started once, as an administrator; after that only cron, run as
      # an installation runs it (separate processes), and on the way what a
      # weekend alone brings: cron stopped for a while, every worker process
      # killed once the first sitting is in. PASS only when the experiment
      # finished by itself — every sitting collected, results there, its place
      # in the line closed.
      - name: Issue 151 — one start, then nobody (cron stopped, workers killed) until finished
        working-directory: ${{ matrix.dirroot }}
        timeout-minutes: 40
        env:
          MOODLE_ROOT: ${{ github.workspace }}/${{ matrix.dirroot }}
        run: |
          set -o pipefail
          php local/catquizlab/cli/one_start_check.php --persons=3 --minutes=35 | tee /tmp/one-start.txt

      # Issues 165/166: an experiment stopped while its workers play it, then
      # resumed — what "Stop experiment" and "Resume experiment" do — and left
      # to cron. The stop comes with a sitting in play; its worker's report
      # after the stop must change nothing. PASS only when the stop closed what
      # was open as cancelled (nothing failed), and after the resume every
      # planned sitting is collected once, the ones from before the stop with
      # the same trace, no simulated person with two finished engine attempts,
      # a second resume finding nothing, the place in the line closed.
      - name: Issues 165/166 — stopped while played, resumed, finished by cron; nothing collected twice, nothing lost
        working-directory: ${{ matrix.dirroot }}
        timeout-minutes: 40
        env:
          MOODLE_ROOT: ${{ github.workspace }}/${{ matrix.dirroot }}
        run: |
          set -o pipefail
          php local/catquizlab/cli/resume_check.php --persons=12 --minutes=35 | tee /tmp/resume-check.txt

      - name: Issue 110 — one long attempt, 120 questions in one sitting
        working-directory: ${{ matrix.dirroot }}
        timeout-minutes: 15
        env:
          MOODLE_ROOT: ${{ github.workspace }}/${{ matrix.dirroot }}
        # The classical test plays the whole pool: three subscales of 40 items,
        # 120 questions in one sitting. The HTTP 500s of #110 came in long
        # classic runs; a short smoke test never gets there. Any failed
        # execution, retried or not, fails the step.
        run: >-
          php local/catquizlab/cli/smoke.php --strategy=classic --persons=1
          --minanswers=60 --minutes=12 --no-navigation-failures

      - name: Issues 141/142/160 — two strategies in parallel, long classic sittings, every forecast against the actual end
        working-directory: ${{ matrix.dirroot }}
        timeout-minutes: 25
        env:
          MOODLE_ROOT: ${{ github.workspace }}/${{ matrix.dirroot }}
        # A classic run of three 120-question sittings and a fastest run, played by the same four workers. Every
        # 5 s a progress snapshot as the page gets it: runs add up to the experiment, the question count never
        # falls without a failure, nothing reads as complete before it is, the experiment's remaining time is its
        # last run's; the page's poll, read right after, is never behind. At the end every forecast against the
        # run's actual end. Alongside, a browser signed in as a temporary manager reads the progress page (header
        # and run rows) every 5 s: never falling, never ahead of the server, no 100 % with sittings queued (#141).
        # Any contradiction, or no moment with two runs in flight, fails the step; snapshots, page readings and
        # the summary are kept as evidence. The same three twins play both strategies: every item both runs put to
        # the same twin, under its own question id in each, must be answered alike, and every played answer must be
        # the one drawn from its common random number (#155); the step export of the played questions is kept.
        run: >-
          php local/catquizlab/cli/smoke.php --strategies=classic,fastest --persons=3
          --minanswers=60 --concurrency=4 --minutes=20 --no-navigation-failures
          --eta-probe=/tmp/eta-probe.jsonl --watch-page=/tmp/watch-page.jsonl --pairs=/tmp/pairs.csv

      - name: AK 6 — one long ALLSUBS sitting, 100+ questions, at the production memory limit
        working-directory: ${{ matrix.dirroot }}
        timeout-minutes: 25
        env:
          MOODLE_ROOT: ${{ github.workspace }}/${{ matrix.dirroot }}
        # ALLSUBS keeps every subscale in play: minimum 100, maximum 105, three
        # subscales of 67 items. With the classic step above, the two kinds of
        # long sitting the 512M fatals of #110 came from.
        run: >-
          php local/catquizlab/cli/smoke.php --strategy=allsubs --persons=1
          --minanswers=100 --minutes=20 --no-navigation-failures

      - name: Issues 134/155/110 — a lost response, a lost request and a response too late are reconciled, nothing answered twice, paired answers kept
        working-directory: ${{ matrix.dirroot }}
        timeout-minutes: 18
        env:
          MOODLE_ROOT: ${{ github.workspace }}/${{ matrix.dirroot }}
          # In each sitting the fifth POST to attempt.php is processed by the
          # server but its response never reaches the browser; the ninth never
          # reaches the server; the twelfth is processed and its response held
          # back past both of the worker's waits (navigation and next page,
          # 2 × 30 s), like the 56–65 s POSTs of CLARA (#110).
          # All three must be reconciled with the server, the page reloaded
          # through the activity and the sitting finished, every question
          # answered exactly once: two sittings, six reconciliations, two of
          # them timeouts — one each, no loop. The same twin plays both
          # strategies; the items both put to it must be answered alike, and
          # every recorded answer, the reconciled ones included, must be the one
          # drawn (#155 DoD3).
          CATQUIZLAB_FAULTS: lostresponse@5,lostrequest@9,slowresponse@12
        run: >-
          php local/catquizlab/cli/smoke.php --strategies=classic,fastest --persons=1
          --minanswers=15 --minutes=12 --expect-recovered=6
          --expect-recovered-reasons=submit_cdp_timeout:2,submit_connect_failed:4 --pairs=/tmp/pairs-recovery.csv

      - name: Issue 100 — load test, 300 sittings to the end without a navigation failure
        working-directory: ${{ matrix.dirroot }}
        timeout-minutes: 90
        env:
          MOODLE_ROOT: ${{ github.workspace }}/${{ matrix.dirroot }}
        # 300 sittings, four workers, some 6000 question transitions. Every
        # execution is counted, including ones a retry later covered: a single
        # "Execution context was destroyed", "did not reach the finish page" or
        # "fetch failed" fails the step. All 300 must be played to the end
        # (--require-all, #139 AK 7): with 30 minutes the Moodle 5.x jobs
        # collected 249 to 260 and stopped there, which said nothing about the
        # rest. The step ends as soon as the last sitting is in; the window is
        # wide for slower machines (a two-core machine needs some 55 minutes).
        run: >-
          php local/catquizlab/cli/smoke.php --strategy=fastest --persons=300
          --concurrency=4 --minutes=80 --no-navigation-failures --require-all

      - name: Issue 102 — the ability range reaches the engine's root scale
        working-directory: ${{ matrix.dirroot }}
        # A truncated N(0, 1.5) within [-4, 4]: the root scale the engine holds
        # must have exactly that range, read back from local_catquiz_catscales.
        run: php local/catquizlab/cli/smoke.php --strategy=fastest --case=102 --provisioning-only

      - name: Issue 104 — effective parameters reach the created activities
        working-directory: ${{ matrix.dirroot }}
        # classic unlimited, allsubs 80, relsubs 40: read back from the engine's
        # record of each created test, not from the definition.
        run: php local/catquizlab/cli/smoke.php --case=104 --provisioning-only
      # Issue 149 AK 2: no secret in any log the plugin writes. The probe sends
      # the plugin's pages requests with a probe value in every place a secret
      # can hide (listed names in every spelling, twice, an unlisted parameter,
      # an e-mail address, a line break, a POST body), traced as the worker's
      # are, and reads every log the plugin wrote for it; the web server's own
      # log is reported apart. Then the logs of the whole run above — request
      # traces and worker logs — are read for any secret parameter with a value.
      - name: Issue 149 — no secret in any log the plugin wrote
        if: always() && steps.web.outcome == 'success'
        working-directory: ${{ matrix.dirroot }}
        run: |
          set -o pipefail
          php local/catquizlab/cli/probe_log_secrets.php --server-log=/tmp/webserver.log | tee /tmp/log-secrets.txt
          files=$(find "$HOME"/moodledata/catquizlab/requests "$HOME"/moodledata/local_catquizlab/worker-logs -type f \
              \( -name '*.jsonl' -o -name '*.log' \) 2>/dev/null | sort | paste -sd, -)
          test -n "$files" || { echo "No log of the plugin to read." >&2; exit 1; }
          php local/catquizlab/cli/scan_logs_for_secrets.php --all --file="$files" | tee -a /tmp/log-secrets.txt

      # The server's side of everything above, from its own trace of the
      # worker's requests: no HTTP 5xx, no PHP fatal — at PHP_MEMORY_LIMIT — and
      # PHP's peak memory per page, beside the resident memory of the web
      # server's processes (AK 6).
      - name: AK 6 — no 5xx, no fatal; PHP peak and process memory
        # Only what was measured: a job that never reached its web server has
        # no figures, and "0 requests, 0 HTTP 5xx" from it is not a result (#135 AK 5).
        if: always() && steps.web.outcome == 'success'
        working-directory: ${{ matrix.dirroot }}
        run: |
          from=$(cat /tmp/e2e-start 2>/dev/null || echo $(( $(date +%s) - 10800 )))
          php local/catquizlab/cli/request_report.php --from="$from" --json > /tmp/request-report.json || true
          echo "memory_limit of the web server: ${PHP_MEMORY_LIMIT}"
          awk -F, 'NR > 1 && $3 > max { max = $3 } END { printf "web server processes: max resident %.1f MB\n", max / 1024 }' \
              /tmp/php-rss.csv | tee /tmp/php-rss-summary.txt
          php local/catquizlab/cli/request_report.php --from="$from" --max-5xx=0 --max-fatals=0 | tee /tmp/request-report.txt

      - name: Keep the evidence
        if: always()
        run: |
          mkdir -p evidence
          cp engine-manifest.txt installed-versions.txt /tmp/request-report.* /tmp/php-rss.csv /tmp/php-rss-summary.txt \
              /tmp/eta-probe.jsonl /tmp/eta-probe.jsonl.summary.json /tmp/watch-page.jsonl /tmp/watch-page.jsonl.log \
              /tmp/pairs.csv /tmp/pairs-recovery.csv /tmp/log-secrets.txt /tmp/race-collect.json \
              /tmp/deep-delete-before.json /tmp/deep-delete-check.txt /tmp/one-start.txt /tmp/resume-check.txt \
              /tmp/claim-bench.txt /tmp/line-order.txt \
              evidence/ 2>/dev/null || true
          if [ "${{ steps.web.outcome }}" != "success" ]; then
            # Said in the artefact itself, so that nobody reads an empty report as a clean one.
            echo "NOT RUN: the job stopped before its web server answered (install: ${{ steps.install.outcome }}, web server: ${{ steps.web.outcome }})." \
                | tee evidence/NOT-RUN.txt
            rm -f evidence/request-report.* evidence/php-rss*
            echo "::warning::No request, memory or 5xx figures were measured in this job."
          fi
          cp /tmp/webserver.log evidence/ 2>/dev/null || true
          echo "memory_limit=${PHP_MEMORY_LIMIT}" > evidence/php-settings.txt

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: catquizlab-worker-e2e-${{ matrix.stack }}-${{ matrix.pins }}
          path: evidence
          retention-days: 14
          if-no-files-found: warn

      # Gate 3 (re-audit 18.11.2026): what this job tested, every component with its version and commit.
      - name: Release manifest of this job
        if: always()
        env:
          CORE_ROOT: ${{ github.workspace }}/${{ matrix.coreroot }}
          MOODLE_ROOT: ${{ github.workspace }}/${{ matrix.dirroot }}
          JOB_NAME: "worker-e2e ${{ matrix.stack }} ${{ matrix.pins }}"
        run: |
          mkdir -p manifest
          bash plugin/.github/scripts/release-manifest.sh > "manifest/manifest-worker-e2e-${{ matrix.stack }}-${{ matrix.pins }}.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: manifest-worker-e2e-${{ matrix.stack }}-${{ matrix.pins }}
          path: manifest
          retention-days: 90

      - name: Collect logs on failure
        if: failure()
        run: |
          cat /tmp/webserver.log || true
          for log in /tmp/catquizlab-smoke/*.log; do
            echo "=== $log ==="
            cat "$log" || true
          done
          for log in "$HOME"/moodledata*/local_catquizlab/worker-logs/*.log; do
            echo "=== $log ==="
            tail -50 "$log" || true
          done
