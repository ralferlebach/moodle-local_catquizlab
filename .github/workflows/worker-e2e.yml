##############################################################################
# Worker CI – local_catquizlab
#
# Two jobs with deliberately different requirements.
#
# "toolchain" proves that the Node/Puppeteer toolchain installs and works. It
# runs on every push and needs no Moodle, no token and no network beyond the
# checkout and the npm install. Before this, that job "smoke tested" the worker
# by pointing it at https://example.invalid, which made it start its normal
# polling loop, call local_catquizlab_job_claim and fail on DNS every single
# time. A job that is red by construction says nothing about the code, so the
# real checks — a syntax check, the unit tests and an offline self test that
# also starts a browser — replace it.
#
# "e2e" plays real sittings through the real UI and therefore needs a running
# Moodle with the CAT engine installed: on every push and pull request to main
# (the release gate, re-audit 16.10.2026 AK 4) and by hand. It runs twice,
# once per engine line: Moodle 4.5 with the legacy set and Moodle 5.2 with the
# 1.3 set, both pinned (.github/engine-pins.env). The web server runs at the
# production memory limit, 512M (AK 6).
##############################################################################

name: Worker CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Also run the end-to-end job (needs the CAT engine)'
        type: boolean
        # Ticked by default: somebody starting this by hand almost always wants
        # the end-to-end run, and having to remember the box means the run that
        # would have caught something is the one that skipped it.
        default: true
        required: false
      memory_limit:
        description: 'PHP memory_limit of the web server (the production reference is 512M)'
        required: false
        default: '512M'
      engine_heads:
        description: 'Test the engine branch heads instead of the pinned commits'
        type: boolean
        required: false
        default: false

concurrency:
  group: worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    name: "Worker toolchain and unit tests"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install worker dependencies (Puppeteer + Chromium)
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Check worker syntax
        working-directory: worker
        run: npm run check

      - name: Run worker unit tests
        working-directory: worker
        run: npm test

      # This is what the old step was actually meant to prove: that Puppeteer
      # resolved and its Chromium download works on this runner. It contacts no
      # Moodle instance and claims no job.
      - name: Worker self test (offline)
        working-directory: worker
        run: npm run selftest

  e2e:
    name: "Worker end-to-end (${{ matrix.stack }}, needs the CAT engine)"
    runs-on: ubuntu-24.04
    needs: toolchain
    # By hand, and as the release gate: every push and pull request to main.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_e2e)
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Moodle 4.5: local_catquiz 1.2.1, the live line.
          - { stack: legacy, moodle: MOODLE_405_STABLE, dirroot: moodle, webroot: moodle }
          # Moodle 5.2: local_catquiz 1.3.0 and the v-3.0 host; code under public/.
          - { stack: moodle5, moodle: MOODLE_502_STABLE, dirroot: moodle/public, webroot: moodle/public }
    env:
      PHP_MEMORY_LIMIT: ${{ github.event.inputs.memory_limit || '512M' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v5
        with:
          path: plugin

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, gd, soap, intl, mbstring, curl, zip, bcmath
          # The command line keeps room; the web server runs at PHP_MEMORY_LIMIT.
          ini-values: max_input_vars=8000, memory_limit=1024M

      - name: Check out Moodle
        run: git clone --depth 1 -b ${{ matrix.moodle }} https://github.com/moodle/moodle.git moodle

      # The pinned engine set of this Moodle line, with the hub subplugins; the
      # manifest records the commits tested.
      - name: Check out the CAT engine and its host activity (pinned set)
        env:
          ENGINE_DIR: ${{ github.workspace }}/${{ matrix.dirroot }}
          ENGINE_LAYOUT: moodle
          ENGINE_SUBMODULES: '1'
          ENGINE_MANIFEST: ${{ github.workspace }}/engine-manifest.txt
          ENGINE_FOLLOW_HEADS: ${{ github.event.inputs.engine_heads == 'true' && '1' || '0' }}
          MOODLE_BRANCH: ${{ matrix.moodle }}
        run: |
          bash plugin/.github/scripts/fetch-engine.sh
          echo "local_catquizlab  ${GITHUB_SHA}" >> "$ENGINE_MANIFEST"
          cp -r plugin ${{ matrix.dirroot }}/local/catquizlab

      - name: Configure Moodle
        run: |
          mkdir -p "$HOME/moodledata"
          cat > moodle/config.php <<'PHP'
          <?php
          unset($CFG);
          global $CFG;
          $CFG = new stdClass();
          $CFG->dbtype    = 'pgsql';
          $CFG->dblibrary = 'native';
          $CFG->dbhost    = '127.0.0.1';
          $CFG->dbname    = 'moodle';
          $CFG->dbuser    = 'postgres';
          $CFG->dbpass    = 'moodle';
          $CFG->prefix    = 'mdl_';
          $CFG->dboptions = ['dbpersist' => 0, 'dbport' => 5432, 'dbsocket' => '', 'dbcollation' => ''];
          $CFG->wwwroot   = 'http://127.0.0.1:8000';
          $CFG->dataroot  = getenv('HOME') . '/moodledata';
          $CFG->admin     = 'admin';
          $CFG->directorypermissions = 0777;
          require_once(__DIR__ . '/lib/setup.php');
          PHP

      - name: Install Moodle
        working-directory: ${{ matrix.dirroot }}
        run: |
          php admin/cli/install_database.php --agree-license \
              --adminpass='Admin123!' --adminemail=admin@example.com \
              --fullname="CATLab E2E" --shortname="CATLabE2E"

      # Everything the worker needs is prepared by the plugin's own CLI rather
      # than assembled in YAML, so the E2E job exercises the same provisioning
      # path an operator uses.
      - name: Provision an experiment, a run and a worker token
        id: prepare
        working-directory: ${{ matrix.dirroot }}
        # Filtered, not trusted. Everything this script writes lands in
        # $GITHUB_OUTPUT, and one line that is not key=value fails the whole
        # step with a parse error instead of the real problem — which has now
        # happened twice: once with a colon in an error message, once with a
        # diagnostic line of mine. Moodle's own fatal errors go to stdout too,
        # so no amount of care inside the script makes this safe.
        run: |
          set -o pipefail
          php local/catquizlab/cli/e2e_prepare.php --persons=1 \
            | tee /tmp/prepare.log \
            | grep -E '^[a-z_]+=' >> "$GITHUB_OUTPUT"

      - name: Show what preparation reported
        if: always()
        run: cat /tmp/prepare.log || true

      - name: Start the web server
        working-directory: ${{ matrix.dirroot }}
        run: |
          # More than one worker. PHP's development server answers one request
          # at a time by default, and the self-test makes an HTTP call to this
          # very server from inside a request — which then waits for itself
          # until it times out and reports the token as not answering. On a
          # real web server this never happens, which is why the same self-test
          # is green on a production site and red here.
          PHP_CLI_SERVER_WORKERS=4 nohup php -d memory_limit="${PHP_MEMORY_LIMIT}" -S 127.0.0.1:8000 -t . \
              > /tmp/webserver.log 2>&1 &
          # The web server's processes, sampled every two seconds: resident memory for AK 6.
          nohup bash -c 'echo "unixtime,pid,rss_kb" > /tmp/php-rss.csv; while true; do
              ps -C php -o pid=,rss= | while read -r pid rss; do echo "$(date +%s),$pid,$rss"; done >> /tmp/php-rss.csv;
              sleep 2; done' > /dev/null 2>&1 &
          date +%s > /tmp/e2e-start
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/; then exit 0; fi
            sleep 1
          done
          echo "The web server did not come up." >&2
          cat /tmp/webserver.log >&2
          exit 1

      - name: Install worker dependencies
        working-directory: ${{ matrix.dirroot }}/local/catquizlab/worker
        run: npm install --no-audit --no-fund

      - name: Play one attempt through the real UI
        working-directory: ${{ matrix.dirroot }}/local/catquizlab/worker
        # The token in the environment, not on the command line, where every
        # process listing shows it (#111).
        env:
          CATQUIZLAB_WORKER_TOKEN: ${{ steps.prepare.outputs.token }}
        run: |
          node run_attempt.js \
              --base-url=http://127.0.0.1:8000 \
              --max-jobs=1

      - name: Verify the queue reports the attempt as finished
        working-directory: ${{ matrix.dirroot }}
        run: php local/catquizlab/cli/e2e_prepare.php --verify --runid=${{ steps.prepare.outputs.runid }}

      # One attempt through the UI proves the worker can play a question. It
      # does not prove that an experiment reaches results, and for five
      # releases it did not: a worker that stopped after one attempt, a
      # heartbeat refused since 0.6.14, and a status card claiming a simulation
      # that was not running all passed every check this repository had.
      - name: Play one experiment per strategy, definition to results
        working-directory: ${{ matrix.dirroot }}
        env:
          MOODLE_ROOT: ${{ github.workspace }}/${{ matrix.dirroot }}
          MINUTES: 4
        run: bash local/catquizlab/cli/smoke_all.sh


      - name: Issue 110 — one long attempt, 120 questions in one sitting
        working-directory: ${{ matrix.dirroot }}
        timeout-minutes: 15
        env:
          MOODLE_ROOT: ${{ github.workspace }}/${{ matrix.dirroot }}
        # The classical test plays the whole pool: three subscales of 40 items,
        # 120 questions in one sitting. The HTTP 500s of #110 came in long
        # classic runs; a short smoke test never gets there. Any failed
        # execution, retried or not, fails the step.
        run: >-
          php local/catquizlab/cli/smoke.php --strategy=classic --persons=1
          --minanswers=60 --minutes=12 --no-navigation-failures

      - name: AK 6 — one long ALLSUBS sitting, 100+ questions, at the production memory limit
        working-directory: ${{ matrix.dirroot }}
        timeout-minutes: 25
        env:
          MOODLE_ROOT: ${{ github.workspace }}/${{ matrix.dirroot }}
        # ALLSUBS keeps every subscale in play: minimum 100, maximum 105, three
        # subscales of 67 items. With the classic step above, the two kinds of
        # long sitting the 512M fatals of #110 came from.
        run: >-
          php local/catquizlab/cli/smoke.php --strategy=allsubs --persons=1
          --minanswers=100 --minutes=20 --no-navigation-failures

      - name: Issue 134 — a lost response and a lost request are reconciled, nothing answered twice
        working-directory: ${{ matrix.dirroot }}
        timeout-minutes: 12
        env:
          MOODLE_ROOT: ${{ github.workspace }}/${{ matrix.dirroot }}
          # The fifth POST to attempt.php is processed by the server but its
          # response never reaches the browser; the ninth never reaches the
          # server. Both must be reconciled with the server and the sitting
          # finished, every question answered exactly once.
          CATQUIZLAB_FAULTS: lostresponse@5,lostrequest@9
        run: >-
          php local/catquizlab/cli/smoke.php --strategy=classic --persons=1
          --minanswers=10 --minutes=8 --expect-recovered=2

      - name: Issue 100 — load test, several hundred sittings without a navigation failure
        working-directory: ${{ matrix.dirroot }}
        timeout-minutes: 35
        env:
          MOODLE_ROOT: ${{ github.workspace }}/${{ matrix.dirroot }}
        # 300 sittings, four workers, some 6000 question transitions. Every
        # execution is counted, including ones a retry later covered: a single
        # "Execution context was destroyed", "did not reach the finish page" or
        # "fetch failed" fails the step.
        run: >-
          php local/catquizlab/cli/smoke.php --strategy=fastest --persons=300
          --concurrency=4 --minutes=30 --no-navigation-failures

      - name: Issue 102 — the ability range reaches the engine's root scale
        working-directory: ${{ matrix.dirroot }}
        # A truncated N(0, 1.5) within [-4, 4]: the root scale the engine holds
        # must have exactly that range, read back from local_catquiz_catscales.
        run: php local/catquizlab/cli/smoke.php --strategy=fastest --case=102 --provisioning-only

      - name: Issue 104 — effective parameters reach the created activities
        working-directory: ${{ matrix.dirroot }}
        # classic unlimited, allsubs 80, relsubs 40: read back from the engine's
        # record of each created test, not from the definition.
        run: php local/catquizlab/cli/smoke.php --case=104 --provisioning-only
      # The server's side of everything above, from its own trace of the
      # worker's requests: no HTTP 5xx, no PHP fatal — at PHP_MEMORY_LIMIT — and
      # PHP's peak memory per page, beside the resident memory of the web
      # server's processes (AK 6).
      - name: AK 6 — no 5xx, no fatal; PHP peak and process memory
        if: always()
        working-directory: ${{ matrix.dirroot }}
        run: |
          from=$(cat /tmp/e2e-start 2>/dev/null || echo $(( $(date +%s) - 10800 )))
          php local/catquizlab/cli/request_report.php --from="$from" --json > /tmp/request-report.json || true
          echo "memory_limit of the web server: ${PHP_MEMORY_LIMIT}"
          awk -F, 'NR > 1 && $3 > max { max = $3 } END { printf "web server processes: max resident %.1f MB\n", max / 1024 }' \
              /tmp/php-rss.csv | tee /tmp/php-rss-summary.txt
          php local/catquizlab/cli/request_report.php --from="$from" --max-5xx=0 --max-fatals=0 | tee /tmp/request-report.txt

      - name: Keep the evidence
        if: always()
        run: |
          mkdir -p evidence
          cp engine-manifest.txt /tmp/request-report.* /tmp/php-rss.csv /tmp/php-rss-summary.txt evidence/ 2>/dev/null || true
          cp /tmp/webserver.log evidence/ 2>/dev/null || true
          echo "memory_limit=${PHP_MEMORY_LIMIT}" > evidence/php-settings.txt

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: catquizlab-worker-e2e-${{ matrix.stack }}
          path: evidence
          retention-days: 14
          if-no-files-found: warn

      - name: Collect logs on failure
        if: failure()
        run: |
          cat /tmp/webserver.log || true
          for log in /tmp/catquizlab-smoke/*.log; do
            echo "=== $log ==="
            cat "$log" || true
          done
          for log in "$HOME"/moodledata*/local_catquizlab/worker-logs/*.log; do
            echo "=== $log ==="
            tail -50 "$log" || true
          done
