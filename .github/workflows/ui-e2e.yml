name: Interface end-to-end

# The release gate for the interface (re-audit 16.10.2026, AK 3): on every
# push and pull request to main, and by hand. It installs Moodle with the
# pinned *candidate* engine set from .github/engine-pins-interface.env,
# independent of the release/worker baselines in .github/engine-pins.env,
# provisions an experiment and plays it through a real
# browser, then runs every Playwright spec — minutes of runner time, which is
# what a release costs. Development branches run it by hand.
#
# Everything it does, it does through the interface. No CLI script sets up the
# experiment, no SQL seeds the queue — the point is that the buttons work, and a
# test that reaches around them cannot tell anybody that. A spec whose fixture
# is missing fails here instead of skipping (CATQUIZLAB_E2E_STRICT).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      persons:
        description: 'Simulated people'
        required: false
        default: '5'
        # There is deliberately no switch for keeping the video: it is kept for
        # every run. A recording that only exists after a failure cannot answer
        # "does the interface still work", which is the question somebody starts
        # this job to ask.
      memory_limit:
        description: 'PHP memory_limit of the web server (the production reference is 512M)'
        required: false
        default: '512M'
      engine_heads:
        description: 'Test the engine branch heads instead of the pinned commits'
        type: boolean
        required: false
        default: false

concurrency:
  group: ui-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Used by the installer and by the test. Written once so they cannot drift.
  CATLAB_ADMIN_USER: admin
  CATLAB_ADMIN_PASSWORD: 'Admin123!'
  # A missing fixture fails a spec instead of skipping it (tests/playwright/support/needs.js).
  CATQUIZLAB_E2E_STRICT: '1'
  # The production reference: the HTTP 500s of #110 came at 512M, so a run at 1024M proves nothing about them.
  PHP_MEMORY_LIMIT: ${{ github.event.inputs.memory_limit || '512M' }}

permissions:
  contents: read

jobs:
  ui-e2e:
    name: "Interface end-to-end (Playwright)"
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v5
        with:
          path: plugin

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, gd, soap, intl, mbstring, curl, zip, bcmath
          # The command line keeps room for the seeding scripts; the web server,
          # which answers the browser, runs at PHP_MEMORY_LIMIT (see its step).
          ini-values: max_input_vars=8000, memory_limit=1024M

      - name: Check out Moodle
        run: git clone --depth 1 -b MOODLE_405_STABLE https://github.com/moodle/moodle.git moodle

      # New CatQuiz #146 engine/host candidates, pinned separately in
      # .github/engine-pins-interface.env. This E2E must not silently test the
      # older release baseline: its manifest records the actual installed SHAs.
      # Promote to shared release/worker pins only after CatQuizLab #136 DoDs.
      - name: Check out the CAT engine and its host activity (pinned set)
        env:
          ENGINE_DIR: ${{ github.workspace }}/moodle
          ENGINE_LAYOUT: moodle
          ENGINE_SUBMODULES: '1'
          ENGINE_MANIFEST: ${{ github.workspace }}/engine-manifest.txt
          PINS_FILE: ${{ github.workspace }}/plugin/.github/engine-pins-interface.env
          ENGINE_FOLLOW_HEADS: ${{ github.event.inputs.engine_heads == 'true' && '1' || '0' }}
          MOODLE_BRANCH: MOODLE_405_STABLE
        run: |
          bash plugin/.github/scripts/fetch-engine.sh
          echo "local_catquizlab  ${GITHUB_SHA}" >> "$ENGINE_MANIFEST"
          cp -r plugin moodle/local/catquizlab

      # A green browser suite against the wrong engine SHA is false evidence.
      # Fail before installation if the manifest does not contain the expected
      # candidate versions. engine_heads deliberately bypasses this candidate
      # gate for exploratory runs but never for push/PR release evidence.
      - name: Verify exact Interface E2E candidate commits
        if: ${{ github.event.inputs.engine_heads != 'true' }}
        run: |
          set -euo pipefail
          grep -E '^local_catquiz[[:space:]]' engine-manifest.txt | grep -Fq '8a62ce30db1fa66fb1712e7079dc4caaf5003f20'
          grep -E '^mod_adaptivequiz[[:space:]]' engine-manifest.txt | grep -Fq '50b7aad7a783003bff30a57e21854120fee0f32d'
          grep -E '^adaptivequizcatmodel_catquiz[[:space:]]' engine-manifest.txt | grep -Fq '1414a9cc8e0f436f19f4647348217196c9692c95'
          echo "Interface E2E candidate set verified against actual checkouts"

      - name: Configure Moodle
        run: |
          mkdir -p "$HOME/moodledata"
          cat > moodle/config.php <<'PHP'
          <?php
          unset($CFG);
          global $CFG;
          $CFG = new stdClass();
          $CFG->dbtype    = 'pgsql';
          $CFG->dblibrary = 'native';
          $CFG->dbhost    = '127.0.0.1';
          $CFG->dbname    = 'moodle';
          $CFG->dbuser    = 'postgres';
          $CFG->dbpass    = 'moodle';
          $CFG->prefix    = 'mdl_';
          $CFG->dboptions = ['dbpersist' => 0, 'dbport' => 5432, 'dbsocket' => '', 'dbcollation' => ''];
          $CFG->wwwroot   = 'http://127.0.0.1:8000';
          $CFG->dataroot  = getenv('HOME') . '/moodledata';
          $CFG->admin     = 'admin';
          $CFG->directorypermissions = 0777;
          require_once(__DIR__ . '/lib/setup.php');
          PHP

      - name: Install Moodle
        working-directory: moodle
        run: |
          php admin/cli/install_database.php --agree-license \
              --adminuser="$CATLAB_ADMIN_USER" \
              --adminpass="$CATLAB_ADMIN_PASSWORD" --adminemail=admin@example.com \
              --fullname="CATLab E2E" --shortname="CATLabE2E"

      # Everything the worker needs is prepared by the plugin's own CLI rather
      # than assembled in YAML, so the E2E job exercises the same provisioning
      # path an operator uses.
      - name: Provision an experiment, a run and a worker token
        id: prepare
        working-directory: moodle
        run: php local/catquizlab/cli/e2e_prepare.php --persons=1 >> "$GITHUB_OUTPUT"

      - name: Start the web server
        working-directory: moodle
        run: |
          # More than one worker. PHP's development server answers one request
          # at a time by default, and the self-test makes an HTTP call to this
          # very server from inside a request — which then waits for itself
          # until it times out and reports the token as not answering. On a
          # real web server this never happens, which is why the same self-test
          # is green on a production site and red here.
          PHP_CLI_SERVER_WORKERS=4 nohup php -d memory_limit="${PHP_MEMORY_LIMIT}" -S 127.0.0.1:8000 -t . > /tmp/webserver.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/; then exit 0; fi
            sleep 1
          done
          echo "The web server did not come up." >&2
          cat /tmp/webserver.log >&2
          exit 1

      - name: Install Playwright and its browser
        working-directory: moodle/local/catquizlab/tests/playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Install the worker's dependencies
        working-directory: moodle/local/catquizlab/worker
        run: npm install --no-audit --no-fund

      # The plugin starts its own workers, and the pipeline task is what makes
      # a queued experiment actually run. Without cron the interface would show
      # an experiment waiting forever, which is correct behaviour and a useless
      # test.
      - name: Run Moodle cron in the background
        working-directory: moodle
        run: |
          nohup bash -c 'while true; do php admin/cli/cron.php >> /tmp/cron.log 2>&1; sleep 20; done' &
          sleep 5

      - name: Seed a failed sitting for the recovery test (#98)
        working-directory: moodle
        run: php local/catquizlab/cli/seed_failed_attempt.php | grep -E '^RECOVERY_RUNID=' >> "$GITHUB_ENV"

      - name: Seed results for the plot checks (#105)
        working-directory: moodle
        run: php local/catquizlab/cli/seed_results.php | grep -E '^PLOTS_EXPERIMENTID=' >> "$GITHUB_ENV"

      - name: Seed a large experiment and a user without rights for the download tests (#121)
        working-directory: moodle
        run: |
          php local/catquizlab/cli/seed_results.php --persons=2000 --label=LARGE | grep -E '^LARGE_EXPERIMENTID=' >> "$GITHUB_ENV"
          php local/catquizlab/cli/seed_plain_user.php > /tmp/plain.env
          echo "::add-mask::$(grep '^PLAIN_PASSWORD=' /tmp/plain.env | cut -d= -f2-)"
          grep -E '^PLAIN_(USER|PASSWORD)=' /tmp/plain.env >> "$GITHUB_ENV"
          rm -f /tmp/plain.env

      - name: Seed a day of request traces for the logs page (#132)
        working-directory: moodle
        # 250 000 lines: the size that ran the logs page out of PHP memory.
        run: php local/catquizlab/cli/seed_request_trace.php --lines=250000 | grep -E '^LOGS_ERRORS=' >> "$GITHUB_ENV"

      - name: Play one experiment through the interface
        working-directory: moodle/local/catquizlab/tests/playwright
        env:
          MOODLE_URL: http://127.0.0.1:8000
          MOODLE_ADMIN: ${{ env.CATLAB_ADMIN_USER }}
          MOODLE_ADMIN_PASSWORD: ${{ env.CATLAB_ADMIN_PASSWORD }}
          PERSONS: ${{ github.event.inputs.persons || '5' }}
        run: npx playwright test

      # What the server did meanwhile, from its own trace of the browser's
      # requests: HTTP status, PHP fatals and PHP's peak memory per page — at
      # the memory limit this run had (AK 6).
      - name: Server figures of the run
        if: always()
        working-directory: moodle
        run: |
          php local/catquizlab/cli/request_report.php --from="$(( $(date +%s) - 7200 ))" | tee /tmp/request-report.txt
          php local/catquizlab/cli/request_report.php --from="$(( $(date +%s) - 7200 ))" --json > /tmp/request-report.json || true

      # Everything somebody would want to look at afterwards, in one file: the
      # video of the run, the trace, the screenshots, the HTML report, and the
      # logs from Moodle, the worker and cron. A passing run is packaged too —
      # watching the interface work is how somebody checks that it still does.
      - name: Package the evidence
        if: always()
        run: |
          mkdir -p evidence
          cp -r moodle/local/catquizlab/tests/playwright/artifacts evidence/artifacts || true
          cp -r moodle/local/catquizlab/tests/playwright/report evidence/report || true
          cp /tmp/webserver.log evidence/webserver.log || true
          cp /tmp/cron.log evidence/cron.log || true
          cp engine-manifest.txt evidence/engine-manifest.txt || true
          cp /tmp/request-report.txt /tmp/request-report.json evidence/ 2>/dev/null || true
          echo "memory_limit=${PHP_MEMORY_LIMIT}" > evidence/php-settings.txt
          mkdir -p evidence/worker-logs
          cp "$HOME"/moodledata*/local_catquizlab/worker-logs/*.log evidence/worker-logs/ 2>/dev/null || true
          find evidence -name '*.webm' -o -name '*.zip' -o -name '*.png' | head -40

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: catquizlab-ui-e2e
          path: evidence
          retention-days: 14
          if-no-files-found: warn
