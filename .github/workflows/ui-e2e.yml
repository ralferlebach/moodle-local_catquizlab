name: Interface end-to-end

# The release gate for the interface (re-audit 16.10.2026, AK 3): on every
# push and pull request to main, and by hand. It installs Moodle with the
# pinned *candidate* engine set from .github/engine-pins-interface.env,
# independent of the release/worker baselines in .github/engine-pins.env,
# provisions an experiment and plays it through a real
# browser, then runs every Playwright spec — minutes of runner time, which is
# what a release costs. Development branches run it by hand.
#
# Everything it does, it does through the interface. No CLI script sets up the
# experiment, no SQL seeds the queue — the point is that the buttons work, and a
# test that reaches around them cannot tell anybody that. A spec whose fixture
# is missing fails here instead of skipping (CATQUIZLAB_E2E_STRICT).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      persons:
        description: 'Simulated people'
        required: false
        default: '5'
        # There is deliberately no switch for keeping the video: it is kept for
        # every run. A recording that only exists after a failure cannot answer
        # "does the interface still work", which is the question somebody starts
        # this job to ask.
      memory_limit:
        description: 'PHP memory_limit of the web server (the production reference is 512M)'
        required: false
        default: '512M'
      engine_heads:
        description: 'Test the engine branch heads instead of the pinned commits'
        type: boolean
        required: false
        default: false

concurrency:
  group: ui-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Used by the installer and by the test. Written once so they cannot drift.
  CATLAB_ADMIN_USER: admin
  CATLAB_ADMIN_PASSWORD: 'Admin123!'
  # A missing fixture fails a spec instead of skipping it (tests/playwright/support/needs.js).
  CATQUIZLAB_E2E_STRICT: '1'
  # The production reference: the HTTP 500s of #110 came at 512M, so a run at 1024M proves nothing about them.
  PHP_MEMORY_LIMIT: ${{ github.event.inputs.memory_limit || '512M' }}

permissions:
  contents: read

jobs:
  ui-e2e:
    name: "Interface end-to-end (${{ matrix.stack }}, pinned CatQuiz #146)"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { stack: legacy, moodle: MOODLE_405_STABLE, coreroot: moodle, dirroot: moodle, webroot: moodle }
          - { stack: moodle5, moodle: MOODLE_502_STABLE, coreroot: moodle, dirroot: moodle/public, webroot: moodle/public }
          - { stack: moodle53, moodle: MOODLE_503_STABLE, coreroot: moodle, dirroot: moodle/public, webroot: moodle/public }
    services:
      postgres:
        image: ${{ matrix.moodle == 'MOODLE_503_STABLE' && 'postgres:17' || 'postgres:16' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v5
        with:
          path: plugin

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, gd, soap, intl, mbstring, curl, zip, bcmath
          # The command line keeps room for the seeding scripts; the web server,
          # which answers the browser, runs at PHP_MEMORY_LIMIT (see its step).
          ini-values: max_input_vars=8000, memory_limit=1024M

      - name: Check out Moodle
        run: git clone --depth 1 -b ${{ matrix.moodle }} https://github.com/moodle/moodle.git moodle

      # New CatQuiz #146 engine/host candidates, pinned separately in
      # .github/engine-pins-interface.env. This E2E must not silently test the
      # older release baseline: its manifest records the actual installed SHAs.
      # Promote to shared release/worker pins only after CatQuizLab #136 DoDs.
      - name: Check out the CAT engine and its host activity (pinned set)
        env:
          ENGINE_DIR: ${{ github.workspace }}/${{ matrix.dirroot }}
          ENGINE_LAYOUT: moodle
          ENGINE_SUBMODULES: '1'
          ENGINE_MANIFEST: ${{ github.workspace }}/engine-manifest.txt
          PINS_FILE: ${{ github.workspace }}/plugin/.github/engine-pins-interface.env
          ENGINE_FOLLOW_HEADS: ${{ github.event.inputs.engine_heads == 'true' && '1' || '0' }}
          MOODLE_BRANCH: ${{ matrix.moodle }}
        run: |
          bash plugin/.github/scripts/fetch-engine.sh
          echo "local_catquizlab  ${GITHUB_SHA}" >> "$ENGINE_MANIFEST"
          cp -r plugin ${{ matrix.dirroot }}/local/catquizlab

      # A green browser suite against the wrong engine SHA is false evidence.
      # Fail before installation if the manifest does not contain the expected
      # candidate versions. engine_heads deliberately bypasses this candidate
      # gate for exploratory runs but never for push/PR release evidence.
      - name: Verify exact Interface E2E candidate commits
        if: ${{ github.event.inputs.engine_heads != 'true' }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.stack }}" == "legacy" ]]; then
            CATQUIZ_SHA=8a62ce30db1fa66fb1712e7079dc4caaf5003f20
            HOST_SHA=50b7aad7a783003bff30a57e21854120fee0f32d
            MODEL_SHA=a7ba07555a30d5cd1f812859ed949dd127721dbd
          else
            CATQUIZ_SHA=02c856f092d91f2387b8499c7c02f8948fb909cc
            HOST_SHA=d3b0dd12f82c759a5a8d256791570fadb4c0111b
            MODEL_SHA=15d4c551b06766a84ad75eea988fe110db58f009
          fi
          grep -E '^local_catquiz[[:space:]]' engine-manifest.txt | grep -Fq "$CATQUIZ_SHA"
          grep -E '^mod_adaptivequiz[[:space:]]' engine-manifest.txt | grep -Fq "$HOST_SHA"
          grep -E '^adaptivequizcatmodel_catquiz[[:space:]]' engine-manifest.txt | grep -Fq "$MODEL_SHA"
          echo "${{ matrix.stack }} candidate engine set verified against actual checkouts"

      - name: Configure Moodle
        run: |
          mkdir -p "$HOME/moodledata"
          cat > ${{ matrix.coreroot }}/config.php <<'PHP'
          <?php
          unset($CFG);
          global $CFG;
          $CFG = new stdClass();
          $CFG->dbtype    = 'pgsql';
          $CFG->dblibrary = 'native';
          $CFG->dbhost    = '127.0.0.1';
          $CFG->dbname    = 'moodle';
          $CFG->dbuser    = 'postgres';
          $CFG->dbpass    = 'moodle';
          $CFG->prefix    = 'mdl_';
          $CFG->dboptions = ['dbpersist' => 0, 'dbport' => 5432, 'dbsocket' => '', 'dbcollation' => ''];
          $CFG->wwwroot   = 'http://127.0.0.1:8000';
          $CFG->dataroot  = getenv('HOME') . '/moodledata';
          $CFG->admin     = 'admin';
          $CFG->directorypermissions = 0777;
          require_once(__DIR__ . '/lib/setup.php');
          PHP

      - name: Check Core, Plugin, and Webroots before installation
        run: |
          set -euo pipefail
          for file in \
            "${{ matrix.coreroot }}/config.php" \
            "${{ matrix.coreroot }}/admin/cli/install_database.php" \
            "${{ matrix.coreroot }}/admin/cli/adhoc_task.php" \
            "${{ matrix.dirroot }}/local/catquiz/version.php" \
            "${{ matrix.dirroot }}/mod/adaptivequiz/version.php" \
            "${{ matrix.dirroot }}/local/catquizlab/version.php" \
            "${{ matrix.webroot }}/index.php" \
            "${{ matrix.webroot }}/config.php"; do
            test -f "$file" || { echo "::error::Missing: $file"; exit 1; }
          done

      - name: Install Moodle
        working-directory: ${{ matrix.coreroot }}
        run: |
          php admin/cli/install_database.php --agree-license \
              --adminuser="$CATLAB_ADMIN_USER" \
              --adminpass="$CATLAB_ADMIN_PASSWORD" --adminemail=admin@example.com \
              --fullname="CATLab E2E" --shortname="CATLabE2E"

      - name: Run the installation's question-bank migration tasks
        working-directory: ${{ matrix.coreroot }}
        run: php admin/cli/adhoc_task.php --execute

      # Everything the worker needs is prepared by the plugin's own CLI rather
      # than assembled in YAML, so the E2E job exercises the same provisioning
      # path an operator uses.
      - name: Provision an experiment, a run and a worker token
        id: prepare
        working-directory: ${{ matrix.dirroot }}
        run: |
          set -o pipefail
          # Moodle deprecation/diagnostic output is not a valid GITHUB_OUTPUT record.
          # Keep the worker token out of public Actions logs; accept only expected keys.
          php local/catquizlab/cli/e2e_prepare.php --persons=1 \
            | grep -E '^(experimentid|runid|attempts|token)=' > /tmp/prepare.out
          # Masked as well (#149): with debug logging GitHub prints every step output ("Set output token = …").
          token=$(sed -n 's/^token=//p' /tmp/prepare.out | head -n 1)
          if [ -n "$token" ]; then echo "::add-mask::$token"; fi
          cat /tmp/prepare.out >> "$GITHUB_OUTPUT"

      - name: Start the web server
        working-directory: ${{ matrix.webroot }}
        run: |
          # More than one worker. PHP's development server answers one request
          # at a time by default, and the self-test makes an HTTP call to this
          # very server from inside a request — which then waits for itself
          # until it times out and reports the token as not answering. On a
          # real web server this never happens, which is why the same self-test
          # is green on a production site and red here.
          PHP_CLI_SERVER_WORKERS=4 nohup php -d memory_limit="${PHP_MEMORY_LIMIT}" -S 127.0.0.1:8000 -t . > /tmp/webserver.log 2>&1 &
          for _ in $(seq 1 20); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/; then exit 0; fi
            sleep 1
          done
          echo "The web server did not come up." >&2
          cat /tmp/webserver.log >&2
          exit 1

      - name: Install Playwright and its browser
        working-directory: ${{ matrix.dirroot }}/local/catquizlab/tests/playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Install the worker's dependencies
        working-directory: ${{ matrix.dirroot }}/local/catquizlab/worker
        run: npm install --no-audit --no-fund

      # The plugin starts its own workers, and the pipeline task is what makes
      # a queued experiment actually run. Without cron the interface would show
      # an experiment waiting forever, which is correct behaviour and a useless
      # test.
      - name: Run Moodle cron in the background
        working-directory: ${{ matrix.coreroot }}
        run: |
          nohup bash -c 'while true; do php admin/cli/cron.php >> /tmp/cron.log 2>&1; sleep 20; done' &
          sleep 5

      - name: Seed a failed sitting for the recovery test (#98)
        working-directory: ${{ matrix.dirroot }}
        run: php local/catquizlab/cli/seed_failed_attempt.php | grep -E '^RECOVERY_RUNID=' >> "$GITHUB_ENV"

      - name: Seed results for the plot checks (#105)
        working-directory: ${{ matrix.dirroot }}
        run: php local/catquizlab/cli/seed_results.php | grep -E '^PLOTS_EXPERIMENTID=' >> "$GITHUB_ENV"

      - name: Seed a large experiment and a user without rights for the download tests (#121)
        working-directory: ${{ matrix.dirroot }}
        run: |
          php local/catquizlab/cli/seed_results.php --persons=2000 --label=LARGE | grep -E '^LARGE_EXPERIMENTID=' >> "$GITHUB_ENV"
          php local/catquizlab/cli/seed_plain_user.php > /tmp/plain.env
          echo "::add-mask::$(grep '^PLAIN_PASSWORD=' /tmp/plain.env | cut -d= -f2-)"
          grep -E '^PLAIN_(USER|PASSWORD)=' /tmp/plain.env >> "$GITHUB_ENV"
          rm -f /tmp/plain.env

      - name: Seed a day of request traces for the logs page (#132)
        working-directory: ${{ matrix.dirroot }}
        # 250 000 lines: the size that ran the logs page out of PHP memory.
        run: php local/catquizlab/cli/seed_request_trace.php --lines=250000 | grep -E '^LOGS_ERRORS=' >> "$GITHUB_ENV"

      # Issue 165: two experiments prepared in the real engine and stopped
      # (what "Stop experiment" does) for experiments_resume.spec.js: one is
      # resumed through the interface and finished by the workers and cron,
      # the other is reset the destructive way. Only the expected keys reach
      # the environment. The spec runs right after experiment.spec.js, which
      # sets the installation up for its workers.
      - name: Issue 165 — two stopped experiments, to resume and to reset
        working-directory: ${{ matrix.dirroot }}
        run: |
          set -o pipefail
          for which in RESUME RESTART; do
            id=$(php local/catquizlab/cli/e2e_prepare.php --persons=4 --name="Issue 165 $which" \
              | grep -E '^experimentid=' | cut -d= -f2)
            test -n "$id"
            php local/catquizlab/cli/stop_experiment.php --experimentid="$id" --yes
            echo "${which}_EXPERIMENTID=$id" >> "$GITHUB_ENV"
          done

      - name: Play one experiment through the interface
        working-directory: ${{ matrix.dirroot }}/local/catquizlab/tests/playwright
        env:
          MOODLE_URL: http://127.0.0.1:8000
          MOODLE_ADMIN: ${{ env.CATLAB_ADMIN_USER }}
          MOODLE_ADMIN_PASSWORD: ${{ env.CATLAB_ADMIN_PASSWORD }}
          PERSONS: ${{ github.event.inputs.persons || '5' }}
        run: npx playwright test

      # The results page as this stack rendered it, for the screen reader jobs
      # below (#122 DoD 3): written by tests/playwright/screenreader_snapshot.spec.js.
      - name: Keep the results page for the screen readers
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenreader-snapshot-${{ matrix.stack }}
          path: ${{ matrix.dirroot }}/local/catquizlab/tests/playwright/artifacts/screenreader
          retention-days: 14
          if-no-files-found: warn

      # Issue 161 DoD 2: the experiment played above, deleted deeply through
      # the interface — the preview, the name typed, the button — and carried
      # out by cron's background task with the real course_delete_module()
      # and the activity's callbacks. Checked before and after against the
      # engine: nothing of any run's footprint left, no row of others lost, no
      # kind of ownerless engine row grown, the deletion record complete. Last,
      # so that no spec that reads the experiment comes after it.
      - name: Issue 161 — the played experiment deleted deeply through the interface, the engine checked before and after
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.dirroot }}/local/catquizlab/tests/playwright
        timeout-minutes: 15
        env:
          MOODLE_URL: http://127.0.0.1:8000
          MOODLE_ADMIN: ${{ env.CATLAB_ADMIN_USER }}
          MOODLE_ADMIN_PASSWORD: ${{ env.CATLAB_ADMIN_PASSWORD }}
          # The experiment experiment.spec.js created and played through the interface, found in the library.
          CATQUIZLAB_DEEP_DELETE: UI smoke
        run: npx playwright test

      # What the server did meanwhile, from its own trace of the browser's
      # requests: HTTP status, PHP fatals and PHP's peak memory per page — at
      # the memory limit this run had (AK 6).
      - name: Server figures of the run
        if: always()
        working-directory: ${{ matrix.dirroot }}
        run: |
          php local/catquizlab/cli/request_report.php --from="$(( $(date +%s) - 7200 ))" | tee /tmp/request-report.txt
          php local/catquizlab/cli/request_report.php --from="$(( $(date +%s) - 7200 ))" --json > /tmp/request-report.json || true

      # Everything somebody would want to look at afterwards, in one file: the
      # video of the run, the trace, the screenshots, the HTML report, and the
      # logs from Moodle, the worker and cron. A passing run is packaged too —
      # watching the interface work is how somebody checks that it still does.
      - name: Package the evidence
        if: always()
        run: |
          mkdir -p evidence
          cp -r ${{ matrix.dirroot }}/local/catquizlab/tests/playwright/artifacts evidence/artifacts || true
          cp -r ${{ matrix.dirroot }}/local/catquizlab/tests/playwright/report evidence/report || true
          cp -r ${{ matrix.dirroot }}/local/catquizlab/tests/playwright/artifacts-deep-delete evidence/ || true
          cp -r ${{ matrix.dirroot }}/local/catquizlab/tests/playwright/report-deep-delete evidence/ || true
          cp /tmp/webserver.log evidence/webserver.log || true
          cp /tmp/cron.log evidence/cron.log || true
          cp engine-manifest.txt evidence/engine-manifest.txt || true
          cp /tmp/request-report.txt /tmp/request-report.json evidence/ 2>/dev/null || true
          echo "memory_limit=${PHP_MEMORY_LIMIT}" > evidence/php-settings.txt
          mkdir -p evidence/worker-logs
          cp "$HOME"/moodledata*/local_catquizlab/worker-logs/*.log evidence/worker-logs/ 2>/dev/null || true
          # Issue 145 — every deletion of the run: queued, started, each run's engine check before and after,
          # failed or finished with what was left (one JSON line per event, kept after the experiment is gone).
          mkdir -p evidence/deletions
          cp "$HOME"/moodledata*/local_catquizlab/deletions/*.jsonl evidence/deletions/ 2>/dev/null || true
          find evidence -name '*.webm' -o -name '*.zip' -o -name '*.png' | head -40

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: catquizlab-ui-e2e-${{ matrix.stack }}
          path: evidence
          retention-days: 14
          if-no-files-found: warn

      # Gate 3 (re-audit 18.11.2026): what this job tested, every component with its version and commit.
      - name: Release manifest of this job
        if: always()
        env:
          CORE_ROOT: ${{ github.workspace }}/${{ matrix.coreroot }}
          MOODLE_ROOT: ${{ github.workspace }}/${{ matrix.dirroot }}
          JOB_NAME: "ui-e2e ${{ matrix.stack }}"
        run: |
          mkdir -p manifest
          bash plugin/.github/scripts/release-manifest.sh > "manifest/manifest-ui-e2e-${{ matrix.stack }}.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: manifest-ui-e2e-${{ matrix.stack }}
          path: manifest
          retention-days: 90

  # #122 DoD 3: the filter bar with real screen readers. NVDA runs only on
  # Windows and VoiceOver only on macOS, while Moodle runs here on Linux: every
  # stack's interface run above keeps its results page as Moodle rendered it
  # (stylesheets inlined, scripts removed) with the list of the bar's controls,
  # and these jobs open that page with the screen reader running and walk the
  # bar with the keyboard (tests/screenreader). The screen reader must announce
  # each control with its name, its role and the value it shows. JAWS has no
  # automation interface that Guidepup can drive and is not tested.
  screen-reader:
    name: "Screen reader (nvda, ${{ matrix.stack }})"
    needs: ui-e2e
    if: ${{ !cancelled() }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stack: [legacy, moodle5, moodle53]
    defaults:
      run:
        shell: bash
        working-directory: tests/screenreader
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: The results page the interface run kept (${{ matrix.stack }})
        uses: actions/download-artifact@v7
        with:
          name: screenreader-snapshot-${{ matrix.stack }}
          path: tests/screenreader/snapshot

      - name: Install the test's dependencies (pinned in package-lock.json)
        run: npm ci --no-audit --no-fund

      - name: Set up the machine for screen reader automation
        run: npx guidepup setup --ci

      - name: Install nvda for Guidepup
        run: npx guidepup install nvda

      - name: Install the browser
        run: npx playwright install chromium

      - name: Walk the filter bar with nvda
        env:
          SR: nvda
        run: npx playwright test

      - name: Upload what the screen reader said
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: catquizlab-screenreader-nvda-${{ matrix.stack }}
          path: |
            tests/screenreader/artifacts
            tests/screenreader/report
            tests/screenreader/test-results
          retention-days: 14
          if-no-files-found: warn

  # VoiceOver: one macOS machine for all three stacks, one after the other.
  # Three macOS jobs at once lost one to GitHub's capacity again and again
  # (fd478bd twice, 995b4a7 once, always "The job was not acquired by Runner of
  # type hosted even after multiple attempts" — not one step ran), while the
  # other two got a machine one after the other. One job asks for one machine.
  # Every stack is still walked in full, with its own snapshot, its own report
  # and its own artefact; the job fails when any stack fails, after all three.
  screen-reader-voiceover:
    name: "Screen reader (voiceover, legacy + moodle5 + moodle53)"
    needs: ui-e2e
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: tests/screenreader
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: The results pages the interface runs kept (all three stacks)
        uses: actions/download-artifact@v7
        with:
          pattern: screenreader-snapshot-*
          path: tests/screenreader/snapshots

      - name: Install the test's dependencies (pinned in package-lock.json)
        run: npm ci --no-audit --no-fund

      - name: Set up the machine for screen reader automation
        run: npx guidepup setup --ci

      - name: Install voiceover for Guidepup
        run: npx guidepup install voiceover

      - name: Install the browser
        run: npx playwright install webkit

      - name: Walk the filter bar with voiceover, stack by stack
        env:
          SR: voiceover
        run: |
          failed=""
          for stack in legacy moodle5 moodle53; do
            echo "::group::VoiceOver on $stack"
            rm -rf snapshot artifacts report test-results
            if [ ! -d "snapshots/screenreader-snapshot-$stack" ]; then
              echo "::error::No results page from the interface run on $stack"
              failed="$failed $stack"
              echo "::endgroup::"
              continue
            fi
            cp -R "snapshots/screenreader-snapshot-$stack" snapshot
            if ! npx playwright test; then
              failed="$failed $stack"
            fi
            mkdir -p "out/$stack"
            for d in artifacts report test-results; do
              if [ -e "$d" ]; then mv "$d" "out/$stack/"; fi
            done
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::VoiceOver failed on:$failed"
            exit 1
          fi
          echo "VoiceOver passed on legacy, moodle5 and moodle53"

      - name: Upload what the screen reader said (legacy)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: catquizlab-screenreader-voiceover-legacy
          path: tests/screenreader/out/legacy
          retention-days: 14
          if-no-files-found: warn

      - name: Upload what the screen reader said (moodle5)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: catquizlab-screenreader-voiceover-moodle5
          path: tests/screenreader/out/moodle5
          retention-days: 14
          if-no-files-found: warn

      - name: Upload what the screen reader said (moodle53)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: catquizlab-screenreader-voiceover-moodle53
          path: tests/screenreader/out/moodle53
          retention-days: 14
          if-no-files-found: warn
